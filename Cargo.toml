[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94.0"
repository = "https://github.com/automagik-dev/genie"

# Exact pins: a dependency moves only by an edit here and a regenerated Cargo.lock.
[workspace.dependencies]
genie-forge = { path = "crates/genie-forge" }
genie-part = { path = "crates/genie-part" }
genie-tasks = { path = "crates/genie-tasks" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
