name: Release Publish

# Group 3 of genie-distribution-cutover — attaches the signed tarballs +
# cosign bundles + SLSA attestations produced by sign-attest.yml to the
# v<version> GitHub Release, and (for non-draft trusted releases) writes
# .well-known/latest.json into the repo so install.sh + `genie update` can
# resolve the latest version per channel without a CDN.
#
# This replaces the cutover G9 cdn.automagik.dev pipeline. GitHub Releases
# is free, maintained by GitHub, and `gh attestation verify` reads cosign
# signatures from Sigstore Rekor without any custom verification server.
#
# Trigger chain:
#   guarded release.yml@main (stable) OR version.yml@main (dev)
#     → Build Tarballs → Sign + Attest → THIS
# All artifacts are from one workflow run; there is no standalone dispatch or
# external run-id recovery path.
#
# Verification by consumers:
#   gh release download v<version> --repo automagik-dev/genie --pattern '*.tar.gz'
#   gh attestation verify genie-<version>-<platform>.tar.gz --owner automagik-dev
#   # OR via cosign:
#   cosign verify-blob \
#     --bundle genie-<version>-<platform>.tar.gz.bundle \
#     --certificate-identity-regexp "^https://github\\.com/automagik-dev/genie/\\.github/workflows/sign-attest\\.yml@refs/heads/main$" \
#     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
#     genie-<version>-<platform>.tar.gz

on:
  # Reusable only from the trusted main-controlled release chain. Stable manual
  # recovery routes through release.yml; dev routes through version.yml.
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (must match upstream artifact version)'
        required: true
        type: string
      channel:
        description: 'Release channel (stable / dev)'
        required: false
        type: string
        default: stable
      source_sha:
        description: 'Exact admitted source commit SHA'
        required: true
        type: string
      source_branch:
        description: 'Branch of the admitted source CI run'
        required: true
        type: string
      source_ci_run_id:
        description: 'Authorizing source CI run ID'
        required: true
        type: string
      trigger_sha:
        description: 'Head SHA of the admitting CI run (automated channels only; source_sha is the built commit)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as draft (require manual promotion)?'
        required: false
        type: boolean
        default: false

concurrency:
  # Only publication is globally serialized. Approval/build/sign jobs for other
  # versions remain parallel, while manifest selection cannot reorder.
  group: release-publish
  queue: max
  cancel-in-progress: false   # never cancel an in-flight publish

permissions:
  contents: read               # each privileged job narrows/elevates explicitly
  attestations: read           # verify any complete published inventory before reuse

jobs:
  # contents:write is useful only after the reusable workflow proves its
  # caller. A dev workflow calling release-publish.yml@main must not inherit a
  # trusted publisher merely because the called file itself lives on main.
  admit:
    name: Admit trusted release orchestrator
    runs-on: ubuntu-latest
    # 5 minutes leaves headroom for the replay guard's bounded retry loop
    # (three sleeps, 30s worst case) on top of normal step time.
    timeout-minutes: 5
    permissions:
      # Read-only, and only so the replay guard below can ask whether the tag
      # already carries a published release. contents:write still starts at the
      # publish job: nothing may mutate the repository before the caller is
      # proven, and the guard runs after the binding step for the same reason.
      contents: read
    steps:
      - name: Bind caller workflow and control commit
        shell: bash
        env:
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_STABLE_CALLER: automagik-dev/genie/.github/workflows/release.yml@refs/heads/main
          EXPECTED_AUTOMATED_CALLER: automagik-dev/genie/.github/workflows/version.yml@refs/heads/main
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
          INPUT_SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
        run: |
          set -euo pipefail
          case "$INPUT_CHANNEL" in
            stable)
              EXPECTED_EVENT=workflow_dispatch
              EXPECTED_CALLER="$EXPECTED_STABLE_CALLER"
              ;;
            dev)
              EXPECTED_EVENT=workflow_run
              EXPECTED_CALLER="$EXPECTED_AUTOMATED_CALLER"
              ;;
            *)
              echo "::error ::release-caller.channel unknown channel '${INPUT_CHANNEL}'"
              exit 1
              ;;
          esac
          if [[ "$CALLER_EVENT" != "$EXPECTED_EVENT" ||
                "$CALLER_REF" != refs/heads/main ||
                "$CALLER_WORKFLOW_REF" != "$EXPECTED_CALLER" ||
                "$CALLER_WORKFLOW_SHA" != "$CALLER_SHA" ]]; then
            echo "::error ::release-caller.untrusted release-publish rejected caller ${CALLER_WORKFLOW_REF:-<empty>} (${CALLER_EVENT:-<empty>})"
            exit 1
          fi
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ||
                ! "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$INPUT_SOURCE_CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error ::release-caller.inputs release-publish received malformed release identity inputs"
            exit 1
          fi
          case "$INPUT_SOURCE_BRANCH" in main|dev) ;; *) exit 1 ;; esac
          case "${INPUT_CHANNEL}:${INPUT_SOURCE_BRANCH}" in
            stable:main|dev:dev) ;;
            *)
              echo "::error ::release-caller.inputs channel/source branch admission mismatch"
              exit 1
              ;;
          esac
          echo "Trusted release caller admitted at ${CALLER_SHA}"

      - name: Refuse re-dispatch of an already published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A published (non-draft) release is immutable, and this pipeline is
          # no longer able to replay one: reconcile-release-assets.sh expects
          # the current 20/28-asset delivery fanout while every pre-fanout
          # release carries 12 that can never be extended, and
          # reconcile-channel-manifests.sh now derives a deterministic
          # midnight-UTC released_at that no longer cmp-matches the wall-clock
          # timestamps already committed to main. Both failures land AFTER the
          # release is published and locked, so refuse the run here instead.
          # Always allocate a fresh version (version.yml allocates max-plus-one
          # and pushes a fresh tag). See automagik-dev/genie#2674.
          # Drafts stay admissible on purpose: an interrupted run must still be
          # able to finish the release it already opened.
          # The probe retries transient API failures (the admit job has no
          # checkout, so it cannot source scripts/gh-retry.sh): a definitive
          # 404 admits, permission failures surface immediately, and anything
          # unresolved after the bounded loop still fails closed below.
          # RETRY_SLEEP_SCALE exists so the behavior test runs without sleeps.
          RELEASE_JSON="$(mktemp)"
          RELEASE_ERROR="$(mktemp)"
          release_probe=unknown
          for attempt in 1 2 3 4; do
            if gh api "repos/${RELEASE_REPOSITORY}/releases/tags/v${INPUT_VERSION}" \
              >"$RELEASE_JSON" 2>"$RELEASE_ERROR"; then
              release_probe=found
              break
            fi
            if grep -q 'HTTP 404' "$RELEASE_ERROR"; then
              release_probe=absent
              break
            fi
            if grep -qiE 'HTTP 40[13]|forbidden|permission|not authorized|bad credentials' "$RELEASE_ERROR"; then
              break
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "::warning ::release-replay probe attempt ${attempt}/4 failed; retrying"
              sleep "$(( ${RETRY_SLEEP_SCALE:-5} * attempt ))"
            fi
          done
          case "$release_probe" in
            found)
              if [[ "$(jq -r '.draft' "$RELEASE_JSON")" != true ]]; then
                echo "::error ::release-replay.published v${INPUT_VERSION} already has a published GitHub Release — published releases are non-replayable (immutable asset inventory + deterministic released_at); allocate a fresh version instead. See automagik-dev/genie#2674"
                exit 1
              fi
              echo "v${INPUT_VERSION} exists only as a draft release; admitting so the interrupted publish can complete"
              ;;
            absent)
              echo "v${INPUT_VERSION} has no GitHub Release yet"
              ;;
            *)
              cat "$RELEASE_ERROR" >&2
              echo "::error ::release-replay.unknown could not determine whether v${INPUT_VERSION} already has a published release; failing closed. See automagik-dev/genie#2674"
              exit 1
              ;;
          esac

  prepare-delivery-evidence:
    name: Build canonical delivery descriptors
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      dogfood_matrix: ${{ steps.build.outputs.dogfood_matrix }}
      update_path_matrix: ${{ steps.build.outputs.update_path_matrix }}
      candidate_manifest_name: ${{ steps.build.outputs.candidate_manifest_name }}
      candidate_manifest_sha256: ${{ steps.build.outputs.candidate_manifest_sha256 }}
      previous_version: ${{ steps.build.outputs.previous_version }}
      previous_manifest_sha256: ${{ steps.build.outputs.previous_manifest_sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Release controls and gate code come from the admitted, protected
          # main commit. Candidate bytes arrive only through signed artifacts.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Download all signed artifacts (sign-attest.yml)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: genie-*-signed
          merge-multiple: true
          path: dist

      - name: Install cosign for effective-subject verification
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install slsa-verifier for effective-subject verification
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Generate retry-stable candidate manifests and descriptors
        id: build
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          CONTROL_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Promotions must endorse the already-published immutable subject
          # bytes, not a functionally equivalent current-run rebuild.
          bash scripts/materialize-release-subjects.sh
          mkdir -p candidate-manifests descriptors
          (
            cd candidate-manifests
            bash "${GITHUB_WORKSPACE}/scripts/reconcile-channel-manifests.sh"
          )
          case "$CHANNEL" in
            stable)
              SELECTED_MANIFEST=candidate-manifests/.well-known/latest.json
              EVIDENCE_CHANNELS=(stable dev)
              ;;
            dev)
              SELECTED_MANIFEST=candidate-manifests/.well-known/dev.json
              EVIDENCE_CHANNELS=(dev)
              ;;
            *) exit 1 ;;
          esac
          bun scripts/candidate-dogfood-matrix.ts \
            --manifest "$SELECTED_MANIFEST" \
            --artifact-dir dist \
            --output candidate-dogfood-matrix.json
          DOGFOOD_MATRIX="$(tr -d '\n' < candidate-dogfood-matrix.json)"
          # release-update-path-smoke runs the two Linux legs of the SAME
          # manifest-derived inventory. It is a projection of
          # candidate-dogfood-matrix.json, never a hand-written platform list:
          # a platform the manifest did not admit cannot appear here, and a
          # renamed or dropped platform fails this job instead of silently
          # narrowing the smoke.
          UPDATE_PATH_MATRIX="$(jq -c '{
            include: [.include[] | select(.platform == "linux-x64-glibc" or .platform == "linux-x64-musl")
                      | {platform, runner, execution}]
          }' candidate-dogfood-matrix.json)"
          [[ "$(jq -er '.include | length' <<<"$UPDATE_PATH_MATRIX")" == 2 ]] || {
            echo "::error::update-path.matrix the candidate manifest admitted no linux-x64-glibc/linux-x64-musl pair"
            exit 1
          }
          CANDIDATE_MANIFEST_NAME="$(basename "$SELECTED_MANIFEST")"
          CANDIDATE_MANIFEST_SHA256="$(jq -er '
            [.include[].manifestSha256] | unique |
            if length == 1 then .[0] else error("candidate manifest digest disagreement") end
          ' candidate-dogfood-matrix.json)"
          [[ "$(jq -er '.include[0].version' candidate-dogfood-matrix.json)" == "$VERSION" ]]
          [[ "$(jq -er '.include[0].channel' candidate-dogfood-matrix.json)" == "$CHANNEL" ]]

          mapfile -t MANIFEST_PLATFORMS < <(jq -er '.include[].platform' candidate-dogfood-matrix.json)

          # The cross-version parent is the exact stable manifest committed at
          # the admitted control SHA. Download its immutable release triplets
          # once, verify them without execution, and pass those same bytes to
          # every native matrix entry. Historical releases are never
          # retro-attested or assigned fabricated delivery descriptors.
          [[ -f .well-known/latest.json && ! -L .well-known/latest.json && -s .well-known/latest.json ]]
          PREVIOUS_VERSION="$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            .well-known/latest.json)"
          [[ "$PREVIOUS_VERSION" != "$VERSION" ]] || {
            echo "::error::dogfood requires a prior stable N distinct from candidate T"
            exit 1
          }
          [[ "$(printf '%s\n%s\n' "$PREVIOUS_VERSION" "$VERSION" | sort -V | head -n 1)" == "$PREVIOUS_VERSION" ]] || {
            echo "::error::dogfood previous stable N must be older than candidate T"
            exit 1
          }
          mkdir previous-release
          cp -- .well-known/latest.json previous-release/manifest.json
          for platform in "${MANIFEST_PLATFORMS[@]}"; do
            previous_tarball="genie-${PREVIOUS_VERSION}-${platform}.tar.gz"
            for previous_name in \
              "$previous_tarball" \
              "${previous_tarball}.bundle" \
              "${previous_tarball}.intoto.jsonl"; do
              gh release download "v${PREVIOUS_VERSION}" \
                --repo "$RELEASE_REPOSITORY" \
                --pattern "$previous_name" \
                --dir previous-release
              [[ -f "previous-release/${previous_name}" &&
                 ! -L "previous-release/${previous_name}" &&
                 -s "previous-release/${previous_name}" ]] || {
                echo "::error::prior stable input is missing or unsafe: ${previous_name}"
                exit 1
              }
            done
            bash scripts/verify-release.sh --local "previous-release/${previous_tarball}"
          done
          bun scripts/candidate-dogfood-matrix.ts \
            --manifest previous-release/manifest.json \
            --artifact-dir previous-release \
            --output previous-dogfood-matrix.json
          jq -e --slurpfile candidate candidate-dogfood-matrix.json '
            [.include[].platform] == [$candidate[0].include[].platform]
          ' previous-dogfood-matrix.json >/dev/null
          PREVIOUS_MANIFEST_SHA256="$(jq -er '
            [.include[].manifestSha256] | unique |
            if length == 1 then .[0] else error("previous manifest digest disagreement") end
          ' previous-dogfood-matrix.json)"

          MATRIX='[]'
          for platform in "${MANIFEST_PLATFORMS[@]}"; do
            tarball="dist/genie-${VERSION}-${platform}.tar.gz"
            [[ -f "$tarball" && ! -L "$tarball" && -s "$tarball" ]] || {
              echo "::error::missing physical signed tarball ${tarball}"
              exit 1
            }
            for evidence_channel in "${EVIDENCE_CHANNELS[@]}"; do
              case "$evidence_channel" in
                stable) manifest=candidate-manifests/.well-known/latest.json ;;
                dev) manifest=candidate-manifests/.well-known/dev.json ;;
              esac
              descriptor="descriptors/genie-${VERSION}-${platform}.tar.gz.${evidence_channel}.delivery.json"
              bun scripts/build-delivery-evidence.ts \
                --tarball "$tarball" \
                --manifest "$manifest" \
                --output "$descriptor" \
                --repository "$RELEASE_REPOSITORY" \
                --version "$VERSION" \
                --channel "$evidence_channel" \
                --platform-id "$platform" \
                --source-sha "$SOURCE_SHA" \
                --source-branch "$SOURCE_BRANCH" \
                --source-ci-run-id "$SOURCE_CI_RUN_ID" \
                --control-sha "$CONTROL_SHA"
              MATRIX="$(jq -cn \
                --argjson current "$MATRIX" \
                --arg platform "$platform" \
                --arg channel "$evidence_channel" \
                '$current + [{platform: $platform, channel: $channel}]')"
            done
          done
          {
            echo "matrix={\"include\":${MATRIX}}"
            echo "dogfood_matrix=${DOGFOOD_MATRIX}"
            echo "update_path_matrix=${UPDATE_PATH_MATRIX}"
            echo "candidate_manifest_name=${CANDIDATE_MANIFEST_NAME}"
            echo "candidate_manifest_sha256=${CANDIDATE_MANIFEST_SHA256}"
            echo "previous_version=${PREVIOUS_VERSION}"
            echo "previous_manifest_sha256=${PREVIOUS_MANIFEST_SHA256}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload manifest-derived standalone dogfood matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-dogfood-candidate-matrix
          path: candidate-dogfood-matrix.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact verified previous-stable inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-dogfood-previous-release
          path: previous-release
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact candidate manifest bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-candidate-manifests
          # `.well-known` is a dot-directory. actions/upload-artifact defaults
          # include-hidden-files to false, which makes @actions/glob skip the
          # traversal root itself (internal-globber.ts drops any item whose
          # basename matches /^\./), so the manifests the previous step just
          # wrote resolve to zero matches and `if-no-files-found: error` fires.
          include-hidden-files: true
          path: candidate-manifests/.well-known/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload canonical descriptor subjects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-descriptors
          path: descriptors/*.delivery.json
          if-no-files-found: error
          retention-days: 1

  attest-delivery-evidence:
    name: Endorse ${{ matrix.channel }} / ${{ matrix.platform }}
    needs: prepare-delivery-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-delivery-evidence.outputs.matrix) }}
    steps:
      - name: Download canonical descriptor subjects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-descriptors
          path: descriptors

      - name: Attest exact descriptor bytes
        id: endorse
        uses: actions/attest@67422f5511b7ff725f4dbd6fb9bd2cd925c65a8d # v1.4.1
        with:
          subject-path: descriptors/genie-${{ inputs.version }}-${{ matrix.platform }}.tar.gz.${{ matrix.channel }}.delivery.json
          predicate-type: https://github.com/${{ github.repository }}/delivery-evidence/v1
          predicate-path: descriptors/genie-${{ inputs.version }}-${{ matrix.platform }}.tar.gz.${{ matrix.channel }}.delivery.json

      - name: Name the persisted Sigstore bundle beside its subject
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.endorse.outputs.bundle-path }}
          DESCRIPTOR: descriptors/genie-${{ inputs.version }}-${{ matrix.platform }}.tar.gz.${{ matrix.channel }}.delivery.json
        run: |
          set -euo pipefail
          [[ -f "$BUNDLE_PATH" && ! -L "$BUNDLE_PATH" && -s "$BUNDLE_PATH" ]]
          cp "$BUNDLE_PATH" "${DESCRIPTOR}.sigstore.json"

      - name: Upload persisted endorsement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-endorsement-${{ matrix.channel }}-${{ matrix.platform }}
          path: descriptors/*.sigstore.json
          if-no-files-found: error
          retention-days: 1

  delivery-evidence-compatibility:
    name: Verify production delivery evidence compatibility
    needs: [admit, attest-delivery-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install the shipped production verifier dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download canonical delivery descriptor subjects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-descriptors
          path: descriptors

      - name: Download all persisted endorsement bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: delivery-endorsement-*
          merge-multiple: true
          path: descriptors

      - name: Download exact candidate manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-candidate-manifests
          path: candidate-manifests

      - name: Verify every pack with the production offline verifier
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable) EXPECTED_PACKS=8 ;;
            dev) EXPECTED_PACKS=4 ;;
            *) exit 1 ;;
          esac
          shopt -s nullglob
          DESCRIPTORS=(descriptors/*.delivery.json)
          [[ ${#DESCRIPTORS[@]} -eq "$EXPECTED_PACKS" ]] || {
            echo "::error::expected ${EXPECTED_PACKS} delivery descriptors, found ${#DESCRIPTORS[@]}"
            exit 1
          }
          for descriptor in "${DESCRIPTORS[@]}"; do
            case "$descriptor" in
              *.stable.delivery.json) manifest=candidate-manifests/latest.json ;;
              *.dev.delivery.json) manifest=candidate-manifests/dev.json ;;
              *) exit 1 ;;
            esac
            bundle="${descriptor}.sigstore.json"
            [[ -f "$bundle" && ! -L "$bundle" && -s "$bundle" ]]
            [[ -f "$manifest" && ! -L "$manifest" && -s "$manifest" ]]
            bun scripts/verify-delivery-evidence-pack.ts \
              --descriptor "$descriptor" \
              --bundle "$bundle" \
              --manifest "$manifest"
          done

  codex-native-dogfood:
    name: Codex standalone task/board dogfood / ${{ matrix.platform }}
    needs: [prepare-delivery-evidence, attest-delivery-evidence, delivery-evidence-compatibility]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-delivery-evidence.outputs.dogfood_matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The harness and validators are trusted release controls. The exact
          # candidate from source_sha is consumed only as a signed archive.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install trusted harness dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned real Codex app-server
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.144.1
          CODEX_PATH="$(node -e 'console.log(require("node:fs").realpathSync(process.argv[1]))' "$(command -v codex)")"
          [[ "$("$CODEX_PATH" --version)" == "codex-cli 0.144.1" ]]
          echo "GENIE_DOGFOOD_REAL_CODEX=${CODEX_PATH}" >> "$GITHUB_ENV"

      - name: Install cosign for previous-stable verification
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      # The upstream installer action bootstraps through a linux-amd64 binary,
      # so it can never run on this job's arm64 runners (darwin-arm64 ENOEXEC,
      # ubuntu-24.04-arm exit 2). Install the platform-correct release asset
      # directly, pinned to the upstream SHA256SUM.md ledger for v2.7.1.
      - name: Install slsa-verifier for previous-stable verification
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  ASSET=slsa-verifier-linux-amd64  SHA256=946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339 ;;
            Linux-aarch64) ASSET=slsa-verifier-linux-arm64  SHA256=5d3b2349ede7bfec19e7a21569f18b9f7410145ad12e9584b175370669e14061 ;;
            Darwin-arm64)  ASSET=slsa-verifier-darwin-arm64 SHA256=39abfcf5f1d690c3e889ce3d2d6a8b87711424d83368511868d414e8f8bcb05c ;;
            *)
              echo "::error::unsupported runner platform for slsa-verifier: $(uname -s)-$(uname -m)"
              exit 1
              ;;
          esac
          mkdir -p "${RUNNER_TEMP}/slsa-verifier-bin"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/${ASSET}"
          echo "${SHA256}  ${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier" | shasum -a 256 -c -
          chmod +x "${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier"
          echo "${RUNNER_TEMP}/slsa-verifier-bin" >> "$GITHUB_PATH"

      # Ubuntu 24.04 images permit creating unprivileged user namespaces but
      # AppArmor denies capability use inside them, so the real Codex sandbox
      # dies at loopback setup ("bwrap: loopback: Failed RTM_NEWADDR"). Lift the
      # restriction so the dogfood exercises Codex's actual bubblewrap sandbox
      # instead of disabling it.
      - name: Allow the Codex bubblewrap sandbox to configure its network namespace
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The harness fails a capability probe on ANY stderr output, and the
      # adapter's first `docker run` of an unpulled image streams pull progress
      # to stderr. Pull the exact pinned digest up front so probe stderr stays
      # clean. Image pin must match scripts/run-musl-dogfood.sh.
      - name: Pre-pull the pinned Alpine image for the musl execution adapter
        if: matrix.execution == 'alpine-container'
        run: docker pull -q 'alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1'

      - name: Download exact verified previous-stable inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-dogfood-previous-release
          path: dogfood-entry/inputs/previous

      - name: Download exact candidate signed triplet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: genie-${{ matrix.version }}-${{ matrix.platform }}-signed
          path: dogfood-entry/inputs/candidate

      - name: Download exact candidate manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-candidate-manifests
          path: dogfood-entry/inputs/candidate/manifests

      - name: Download canonical candidate descriptors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-descriptors
          path: dogfood-entry/inputs/candidate/descriptors

      - name: Download exact candidate delivery endorsement
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-endorsement-${{ matrix.channel }}-${{ matrix.platform }}
          path: dogfood-entry/inputs/candidate/descriptors

      - name: Resolve native execution adapter
        id: adapter
        shell: bash
        env:
          EXECUTION_KIND: ${{ matrix.execution }}
        run: |
          set -euo pipefail
          case "$EXECUTION_KIND" in
            host-native)
              echo 'path=' >> "$GITHUB_OUTPUT"
              ;;
            alpine-container)
              ADAPTER="${GITHUB_WORKSPACE}/scripts/run-musl-dogfood.sh"
              [[ -f "$ADAPTER" && ! -L "$ADAPTER" && -x "$ADAPTER" ]] || {
                echo "::error::pinned musl execution adapter is unavailable"
                exit 1
              }
              echo "path=${ADAPTER}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::manifest matrix selected unknown execution kind ${EXECUTION_KIND}"
              exit 1
              ;;
          esac

      - name: Run exact N to T lifecycle and emit reusable evidence
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PREVIOUS_VERSION: ${{ needs.prepare-delivery-evidence.outputs.previous_version }}
          CANDIDATE_VERSION: ${{ matrix.version }}
          CANDIDATE_CHANNEL: ${{ matrix.channel }}
          CANDIDATE_MANIFEST_NAME: ${{ matrix.manifest }}
          EXECUTION_ADAPTER: ${{ steps.adapter.outputs.path }}
        run: |
          set -euo pipefail
          PREVIOUS_ARTIFACT="dogfood-entry/inputs/previous/genie-${PREVIOUS_VERSION}-${PLATFORM}.tar.gz"
          CANDIDATE_ARTIFACT="dogfood-entry/inputs/candidate/genie-${CANDIDATE_VERSION}-${PLATFORM}.tar.gz"
          CANDIDATE_DESCRIPTOR="dogfood-entry/inputs/candidate/descriptors/genie-${CANDIDATE_VERSION}-${PLATFORM}.tar.gz.${CANDIDATE_CHANNEL}.delivery.json"
          EVIDENCE="dogfood-entry/codex-dogfood-${CANDIDATE_VERSION}-${PLATFORM}.md"
          RUNNER_ARGS=(
            --previous-artifact "$PREVIOUS_ARTIFACT"
            --previous-manifest dogfood-entry/inputs/previous/manifest.json
            --previous-bundle "${PREVIOUS_ARTIFACT}.bundle"
            --previous-provenance "${PREVIOUS_ARTIFACT}.intoto.jsonl"
            --candidate-artifact "$CANDIDATE_ARTIFACT"
            --candidate-manifest "dogfood-entry/inputs/candidate/manifests/${CANDIDATE_MANIFEST_NAME}"
            --candidate-descriptor "$CANDIDATE_DESCRIPTOR"
            --candidate-bundle "${CANDIDATE_DESCRIPTOR}.sigstore.json"
            --platform-id "$PLATFORM"
            --output-evidence "$EVIDENCE"
          )
          if [[ -n "$EXECUTION_ADAPTER" ]]; then
            RUNNER_ARGS+=(--execution-adapter "$EXECUTION_ADAPTER")
          fi
          bun tests/support/codex-dogfood-entry-runner.ts "${RUNNER_ARGS[@]}"
          bun scripts/validate-live-dogfood-evidence.ts \
            --file "$EVIDENCE" \
            --inputs-root dogfood-entry

      - name: Upload exact per-entry evidence and referenced inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-dogfood-evidence-${{ matrix.platform }}
          path: dogfood-entry
          if-no-files-found: error
          retention-days: 30

  codex-dogfood-completeness:
    name: Require complete Codex standalone dogfood matrix
    needs: [prepare-delivery-evidence, codex-native-dogfood]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Reject failed, skipped, or unavailable standalone entries
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare-delivery-evidence.result }}
          STANDALONE_RESULT: ${{ needs.codex-native-dogfood.result }}
          EXPECTED_MATRIX: ${{ needs.prepare-delivery-evidence.outputs.dogfood_matrix }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare-delivery-evidence.outputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_RESULT" == success && "$STANDALONE_RESULT" == success ]] || {
            echo "::error::Codex dogfood is incomplete (prepare=${PREPARE_RESULT}, standalone=${STANDALONE_RESULT})"
            exit 1
          }
          [[ -n "$EXPECTED_MATRIX" && -n "$EXPECTED_MANIFEST_SHA256" ]] || {
            echo "::error::Codex dogfood candidate identity is unavailable"
            exit 1
          }

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Download manifest-derived candidate matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-dogfood-candidate-matrix
          path: aggregate

      - name: Download every native entry
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: codex-dogfood-evidence-*
          path: aggregate/entries

      - name: Validate one-to-one evidence and persist candidate identity
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_CHANNEL: ${{ inputs.channel }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_MATRIX: ${{ needs.prepare-delivery-evidence.outputs.dogfood_matrix }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare-delivery-evidence.outputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$(tr -d '\n' < aggregate/candidate-dogfood-matrix.json)" == "$EXPECTED_MATRIX" ]] || {
            echo "::error::downloaded candidate matrix differs from the matrix used to schedule native jobs"
            exit 1
          }
          bun scripts/validate-dogfood-matrix-evidence.ts \
            --matrix aggregate/candidate-dogfood-matrix.json \
            --evidence-dir aggregate/entries \
            --version "$EXPECTED_VERSION" \
            --channel "$EXPECTED_CHANNEL" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --candidate-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --output aggregate/codex-dogfood-completeness.json

      - name: Upload complete Codex dogfood evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-dogfood-completeness
          path: aggregate/codex-dogfood-completeness.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Wish `skills-everywhere`, C5 — two candidate-facing smokes added ALONGSIDE
  # the Codex dogfood matrix above (which is unchanged) and required by
  # `publish` below.
  # ---------------------------------------------------------------------------

  # The skills.sh channel is the ONE supported way genie product skills reach an
  # agent home, so a release candidate must prove the PRODUCTION argv from
  # src/lib/skills-installer.ts actually lands byte-identical skills there.
  #
  # The source is a LOCAL PATH, not a GitHub ref: skills@1.5.23 ignores the
  # `@<ref>` suffix and always serves the repository's default branch (measured
  # three ways on 2026-08-31), which made a ref-pinned gate assert `main`'s tree
  # rather than the candidate's. The candidate checkout's own `skills/` stands
  # in for the delivered `$GENIE_HOME/skills` tree the shipped binary points at
  # (wish `skills-everywhere-b`, G1) — same argv shape, genuinely pinned.
  #
  # This job checks out `inputs.source_sha` rather than the admitted control
  # commit because the candidate tree is the COMPARISON SUBJECT here, not
  # executable release-control code: nothing from that checkout is run, only
  # `cmp`ed against what the CLI wrote. Every other job's control/candidate
  # split is untouched.
  skills-install-smoke:
    name: skills.sh channel install smoke
    needs: prepare-delivery-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # `secrets` is not an allowed context in ANY `if:` expression, so the
      # optional live `codex exec` leg below is gated on this BOOLEAN instead.
      # Only the boolean is job-level: the secret itself is mapped onto the one
      # step that runs `codex exec`, so the third-party `npx -y skills@...`
      # download and every other step in this job run with no OPENAI_API_KEY in
      # their environment. The repository ships no OPENAI_API_KEY today, so
      # that leg normally skips; every file-level assertion below runs
      # unconditionally and is what actually gates the release.
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # Same pin as codex-native-dogfood's app-server install and ci.yml's
      # codex-smoke, so all three agree on exactly one Codex generation.
      - name: Install pinned real Codex CLI
        run: npm install -g @openai/codex@0.144.1

      # No agent home is pre-created here. `--all -g` does not probe the host:
      # the pinned CLI reports "Installing to all 77 agents" and creates every
      # home itself. Verified 2026-08-30 against a HOME that contained no agent
      # directory at all — the run created 55 of them, `~/.claude/skills`
      # included — so a `mkdir -p ~/.claude` would assert nothing. The Claude
      # Code CLI DOES install non-interactively (`npm install -g
      # @anthropic-ai/claude-code`); it is left out because it would add a
      # second unpinned npm install to a release gate without changing a single
      # assertion below.
      - name: Install the candidate's skills with the production argv
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/skills-evidence"
          # Byte-for-byte the argv built by src/lib/skills-installer.ts
          # (`npx -y skills@<SKILLS_CLI_VERSION> add <GENIE_HOME>/skills --all
          # --copy -g`), with this checkout's `skills/` standing in for the
          # delivered `$GENIE_HOME/skills` tree.
          # The argv is exact; only the ATTEMPT is bounded-retried, because the
          # call still downloads the CLI from npm and a transport blip must not
          # read as a release-blocking product failure.
          attempt=1
          until npx -y skills@1.5.23 add "${GITHUB_WORKSPACE}/skills" --all --copy -g \
            >"${RUNNER_TEMP}/skills-evidence/install.log" 2>&1; do
            if (( attempt >= 3 )); then
              cat "${RUNNER_TEMP}/skills-evidence/install.log"
              echo "::error::skills-install.failed the production skills.sh argv did not succeed in ${attempt} attempts"
              exit 1
            fi
            echo "::warning::skills.sh install attempt ${attempt} failed; retrying"
            tail -n 20 "${RUNNER_TEMP}/skills-evidence/install.log"
            sleep $(( attempt * 15 ))
            attempt=$(( attempt + 1 ))
          done
          tail -n 30 "${RUNNER_TEMP}/skills-evidence/install.log"

      - name: Assert every created agent skill home holds byte-equal candidate skills
        env:
          SKILLS_REF: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # The homes are READ OUT of the shipped table rather than restated
          # here, so adding an entry to KNOWN_AGENT_SKILL_HOMES widens this gate
          # automatically and a rename fails it loudly instead of silently
          # narrowing it.
          if [[ ! -f src/lib/skills-installer.ts ]]; then
            echo "::error::skills-install.table candidate ${SKILLS_REF} predates src/lib/skills-installer.ts; this gate cannot bind its agent-home table"
            exit 1
          fi
          mapfile -t AGENT_HOMES < <(
            awk '/^export const KNOWN_AGENT_SKILL_HOMES/,/^\];/' src/lib/skills-installer.ts |
              grep -oE "segments: \[[^]]*\]" |
              sed -E "s/^segments: \[//; s/\]$//; s/'//g; s/, /\//g"
          )
          if [[ ${#AGENT_HOMES[@]} -lt 2 ]]; then
            echo "::error::skills-install.table could not read KNOWN_AGENT_SKILL_HOMES from the candidate checkout"
            exit 1
          fi
          printf 'agent skill homes declared by the candidate: %s\n' "${AGENT_HOMES[*]}"

          shopt -s nullglob
          SKILLS=()
          for path in skills/*/SKILL.md; do
            SKILLS+=("$(basename "$(dirname "$path")")")
          done
          if [[ ${#SKILLS[@]} -eq 0 ]]; then
            echo "::error::skills-install.inventory the candidate checkout ships no skills/*/SKILL.md"
            exit 1
          fi

          CHECKED=0
          ABSENT=()
          for rel in "${AGENT_HOMES[@]}"; do
            home="${HOME}/${rel}"
            if [[ ! -d "$home" ]]; then
              ABSENT+=("$rel")
              continue
            fi
            CHECKED=$((CHECKED + 1))
            for name in "${SKILLS[@]}"; do
              installed="${home}/${name}/SKILL.md"
              if [[ ! -f "$installed" || -L "$installed" ]]; then
                echo "::error::skills-install.missing ${rel}/${name}/SKILL.md was not installed as a physical file"
                exit 1
              fi
              # The contract is the WHOLE `skills/<name>` tree, not its entry
              # file: references/, scripts and templates are what a skill
              # actually executes. `--no-dereference` compares any symlink as a
              # link so a replaced file cannot pass as equal content.
              if ! diff -r --no-dereference -- "skills/${name}" "${home}/${name}"; then
                echo "::error::skills-install.drift ${rel}/${name}/ differs from the candidate checkout"
                exit 1
              fi
            done
          done
          if [[ "$CHECKED" -eq 0 ]]; then
            echo "::error::skills-install.no-home the pinned skills CLI created no known agent skill home"
            exit 1
          fi
          if [[ ${#ABSENT[@]} -gt 0 ]]; then
            echo "::notice::skills@1.5.23 creates no home for: ${ABSENT[*]}"
          fi
          printf 'verified %d skills byte-equal across %d agent skill home(s)\n' "${#SKILLS[@]}" "$CHECKED"
          mkdir -p "${RUNNER_TEMP}/skills-evidence"
          {
            printf '{"schemaVersion":1,"ref":"%s","skills":%d,"homesChecked":%d,"homesAbsent":"%s"}\n' \
              "$SKILLS_REF" "${#SKILLS[@]}" "$CHECKED" "${ABSENT[*]-}"
          } >"${RUNNER_TEMP}/skills-evidence/summary.json"

      # Ubuntu 24.04 images permit unprivileged user namespaces but AppArmor
      # denies capability use inside them, so the real Codex sandbox dies at
      # loopback setup. Same lift as codex-native-dogfood; only needed for the
      # live `codex exec` below, so it is gated identically.
      - name: Allow the Codex bubblewrap sandbox to configure its network namespace
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prove Codex can invoke an installed skill non-interactively
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          # The only step in this job that sees the real secret.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # `$wish` is the skill invocation Codex
          # must resolve; the shell must NOT expand it.
          if ! codex exec --full-auto 'Use $wish to print its own first heading and stop' \
            >"${RUNNER_TEMP}/skills-evidence/codex-exec.log" 2>&1; then
            cat "${RUNNER_TEMP}/skills-evidence/codex-exec.log"
            echo "::error::skills-install.codex-exec the pinned Codex CLI could not run an installed skill"
            exit 1
          fi
          cat "${RUNNER_TEMP}/skills-evidence/codex-exec.log"

      - name: Upload skills channel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-install-smoke-evidence
          path: ${{ runner.temp }}/skills-evidence
          if-no-files-found: warn
          retention-days: 30

  # WHAT THIS JOB PROVES THAT NO EARLIER JOB DOES.
  #
  # `prepare-delivery-evidence`, `delivery-evidence-compatibility` and
  # `stable-release-security-gate` reason about the candidate's evidence.
  # `codex-native-dogfood` does run the update-side delivery path, but only
  # INSIDE the Codex-plugin harness, on a host that harness builds for itself:
  # a fake Codex CLI on PATH, a trusted-projects config, and a plugin cache
  # pre-seeded with N.
  #
  # This job runs that same update-side code path — `genie update
  # --publish-local-delivery`, the candidate binary publishing an authenticated
  # delivery out of verified local bytes — on a PLAIN host: no Codex home, no
  # plugin registration, no harness, and a live generation that is the real
  # previous stable N. Real N as the parent, real T as the binary, no Codex
  # anywhere is the shape of an ordinary user's machine, and it is exercised
  # nowhere else in this pipeline. The assertion is the delivery contract
  # itself: exit 2, a `activation-pending` result trailer, `deliveryComplete`
  # true — delivery published, activation still withheld until explicit
  # consent.
  #
  # It is deliberately NOT a networked `genie update`: at this point in the
  # pipeline the candidate has no GitHub Release and no
  # `.well-known/<channel>.json` entry, so `update`'s normal resolve-and-
  # download path has nothing to resolve. A true networked N->T update is only
  # possible AFTER publication; the orchestrator records that run against the
  # published release, not here.
  #
  # Everything downstream of the download is real: cosign + SLSA verification
  # of both generations, delivery-evidence verification with the SHIPPED
  # offline verifier, the generation layout, `--version`, the update-era
  # capability report, the local delivery publication, and standalone
  # task/board on both a repository seeded under N and an untouched one.
  #
  # The step sequence is copied from codex-native-dogfood (checkout of the
  # admitted control commit, pinned bun, trusted dependencies, cosign, the
  # platform-correct slsa-verifier, the digest-pinned Alpine pre-pull, the
  # artifact downloads and the execution-adapter resolution); only the
  # Codex-plugin harness and its evidence validators are dropped.
  release-update-path-smoke:
    name: Release update path smoke / ${{ matrix.platform }}
    needs: [prepare-delivery-evidence, attest-delivery-evidence, delivery-evidence-compatibility]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-delivery-evidence.outputs.update_path_matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Verifiers and the musl execution adapter are trusted release
          # controls. The candidate is consumed only as a signed archive.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install the shipped production verifier dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install cosign for release verification
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      # Same direct, ledger-pinned install codex-native-dogfood uses: the
      # upstream installer action bootstraps through a linux-amd64 binary.
      - name: Install slsa-verifier for release verification
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  ASSET=slsa-verifier-linux-amd64  SHA256=946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339 ;;
            Linux-aarch64) ASSET=slsa-verifier-linux-arm64  SHA256=5d3b2349ede7bfec19e7a21569f18b9f7410145ad12e9584b175370669e14061 ;;
            Darwin-arm64)  ASSET=slsa-verifier-darwin-arm64 SHA256=39abfcf5f1d690c3e889ce3d2d6a8b87711424d83368511868d414e8f8bcb05c ;;
            *)
              echo "::error::unsupported runner platform for slsa-verifier: $(uname -s)-$(uname -m)"
              exit 1
              ;;
          esac
          mkdir -p "${RUNNER_TEMP}/slsa-verifier-bin"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/${ASSET}"
          echo "${SHA256}  ${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier" | shasum -a 256 -c -
          chmod +x "${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier"
          echo "${RUNNER_TEMP}/slsa-verifier-bin" >> "$GITHUB_PATH"

      # Image pin must match scripts/run-musl-dogfood.sh — identical to the
      # Codex matrix's pre-pull.
      - name: Pre-pull the pinned Alpine image for the musl execution adapter
        if: matrix.execution == 'alpine-container'
        run: docker pull -q 'alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1'

      - name: Download exact verified previous-stable inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-dogfood-previous-release
          path: update-path/inputs/previous

      - name: Download exact candidate signed triplet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: genie-${{ inputs.version }}-${{ matrix.platform }}-signed
          path: update-path/inputs/candidate

      - name: Download exact candidate manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-candidate-manifests
          path: update-path/inputs/candidate/manifests

      - name: Download canonical candidate descriptors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-descriptors
          path: update-path/inputs/candidate/descriptors

      - name: Download exact candidate delivery endorsement
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-endorsement-${{ inputs.channel }}-${{ matrix.platform }}
          path: update-path/inputs/candidate/descriptors

      - name: Resolve native execution adapter
        id: adapter
        shell: bash
        env:
          EXECUTION_KIND: ${{ matrix.execution }}
        run: |
          set -euo pipefail
          case "$EXECUTION_KIND" in
            host-native)
              echo 'path=' >> "$GITHUB_OUTPUT"
              ;;
            alpine-container)
              ADAPTER="${GITHUB_WORKSPACE}/scripts/run-musl-dogfood.sh"
              [[ -f "$ADAPTER" && ! -L "$ADAPTER" && -x "$ADAPTER" ]] || {
                echo "::error::pinned musl execution adapter is unavailable"
                exit 1
              }
              echo "path=${ADAPTER}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown execution kind ${EXECUTION_KIND}"
              exit 1
              ;;
          esac

      - name: Verify N and T, swap the live generation, and prove standalone task/board
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PREVIOUS_VERSION: ${{ needs.prepare-delivery-evidence.outputs.previous_version }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_CHANNEL: ${{ inputs.channel }}
          CANDIDATE_MANIFEST_NAME: ${{ needs.prepare-delivery-evidence.outputs.candidate_manifest_name }}
          EXECUTION_ADAPTER: ${{ steps.adapter.outputs.path }}
        run: |
          set -euo pipefail
          INPUTS="${GITHUB_WORKSPACE}/update-path/inputs"
          PREVIOUS_ARTIFACT="${INPUTS}/previous/genie-${PREVIOUS_VERSION}-${PLATFORM}.tar.gz"
          CANDIDATE_ARTIFACT="${INPUTS}/candidate/genie-${CANDIDATE_VERSION}-${PLATFORM}.tar.gz"
          CANDIDATE_DESCRIPTOR="${INPUTS}/candidate/descriptors/genie-${CANDIDATE_VERSION}-${PLATFORM}.tar.gz.${CANDIDATE_CHANNEL}.delivery.json"
          CANDIDATE_MANIFEST="${INPUTS}/candidate/manifests/${CANDIDATE_MANIFEST_NAME}"
          for required in "$PREVIOUS_ARTIFACT" "$CANDIDATE_ARTIFACT" "$CANDIDATE_DESCRIPTOR" \
            "${CANDIDATE_DESCRIPTOR}.sigstore.json" "$CANDIDATE_MANIFEST"; do
            [[ -f "$required" && ! -L "$required" && -s "$required" ]] || {
              echo "::error::update-path.inputs missing or unsafe input: ${required}"
              exit 1
            }
          done

          # 1. Both generations are signed release bytes (cosign + SLSA), the
          #    same gate the Codex dogfood applies to its previous-stable parent.
          bash scripts/verify-release.sh --local "$PREVIOUS_ARTIFACT"
          bash scripts/verify-release.sh --local "$CANDIDATE_ARTIFACT"

          # 2. The candidate's delivery evidence verifies with the SHIPPED
          #    offline verifier — the same inputs the Codex dogfood consumes.
          bun scripts/verify-delivery-evidence-pack.ts \
            --descriptor "$CANDIDATE_DESCRIPTOR" \
            --bundle "${CANDIDATE_DESCRIPTOR}.sigstore.json" \
            --manifest "$CANDIDATE_MANIFEST"

          # 3. One canonical stateful root. run-musl-dogfood.sh requires the
          #    candidate binary, the cwd and every state directory to be
          #    physically contained in exactly this path.
          ROOT="${RUNNER_TEMP}/update-path-root"
          mkdir -p "$ROOT"
          ROOT="$(cd -- "$ROOT" && pwd -P)"
          export DOGFOOD_ROOT="$ROOT"
          export HOME="${ROOT}/home"
          export GENIE_HOME="${ROOT}/genie-home"
          export CODEX_HOME="${ROOT}/codex-home"
          export TMPDIR="${ROOT}/tmp"
          export XDG_CONFIG_HOME="${ROOT}/home/.config"
          export XDG_CACHE_HOME="${ROOT}/home/.cache"
          export XDG_DATA_HOME="${ROOT}/home/.local/share"
          export XDG_STATE_HOME="${ROOT}/home/.local/state"
          export GIT_CONFIG_GLOBAL="${ROOT}/home/.gitconfig"
          export GIT_CONFIG_NOSYSTEM=1
          export NO_COLOR=1
          mkdir -p "$HOME" "$CODEX_HOME" "$TMPDIR" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" \
            "$XDG_DATA_HOME" "$XDG_STATE_HOME" "${GENIE_HOME}/bin" "${ROOT}/bin" "${ROOT}/repos"

          install_generation() {
            local tarball="$1" version="$2" stage
            stage="$(mktemp -d "${ROOT}/stage-XXXXXX")"
            tar -xzf "$tarball" -C "$stage"
            [[ -f "${stage}/genie" && ! -L "${stage}/genie" ]] || {
              echo "::error::update-path.payload ${tarball} carries no physical genie binary"
              exit 1
            }
            [[ -d "${stage}/plugins/genie" && ! -L "${stage}/plugins/genie" ]] || {
              echo "::error::update-path.payload ${tarball} carries no plugin payload"
              exit 1
            }
            rm -rf -- "${GENIE_HOME}/plugins/genie"
            mkdir -p "${GENIE_HOME}/bin" "${GENIE_HOME}/plugins"
            cp -- "${stage}/genie" "${GENIE_HOME}/bin/genie"
            chmod 0755 "${GENIE_HOME}/bin/genie"
            cp -R -- "${stage}/plugins/genie" "${GENIE_HOME}/plugins/genie"
            # A real release binary resolves its version from the VERSION file
            # adjacent to the executable; the live layout keeps both copies.
            printf '%s\n' "$version" >"${GENIE_HOME}/VERSION"
            printf '%s\n' "$version" >"${GENIE_HOME}/bin/VERSION"
            rm -rf -- "$stage"
          }

          run_genie() {
            if [[ -n "$EXECUTION_ADAPTER" ]]; then
              "$EXECUTION_ADAPTER" "${GENIE_HOME}/bin/genie" "$@"
            else
              "${GENIE_HOME}/bin/genie" "$@"
            fi
          }

          init_repo() {
            local path="$1"
            mkdir -p "$path"
            git -C "$path" init -q -b main
            git -C "$path" config user.email 'update-path@test.invalid'
            git -C "$path" config user.name 'Update Path Smoke'
            git -C "$path" commit --allow-empty -q -m seed
          }

          assert_version() {
            local expected="$1" observed
            observed="$(run_genie --version)"
            [[ "$observed" == *"$expected"* ]] || {
              echo "::error::update-path.version expected v${expected}, genie reported '${observed}'"
              exit 1
            }
            printf 'genie --version -> %s\n' "$observed"
          }

          # Safe to run against N as well as T: `--print-update-capabilities`
          # landed in 4c1029cd1 (2026-07-21) and every N this job can select is
          # >= 5.260816.2, so the flag is present on both generations. The Codex
          # harness deliberately never probes N (it must not disturb the parent
          # it is about to hand over); this job owns no plugin state to disturb,
          # so the N-side probe is free evidence that the parent is intact.
          assert_capabilities() {
            local expected="$1" report reported
            report="$(run_genie update --print-update-capabilities --json)"
            reported="$(printf '%s' "$report" | jq -er '.reportedVersion')"
            [[ "$reported" == "$expected" ]] || {
              echo "::error::update-path.capabilities capability report claims ${reported}, expected ${expected}"
              exit 1
            }
            printf 'genie update --print-update-capabilities -> %s\n' "$report"
          }

          assert_standalone() {
            local label="$1" output
            output="$(run_genie task list --json)" || {
              echo "::error::update-path.task-list ${label}: 'genie task list --json' exited non-zero"
              exit 1
            }
            printf '%s' "$output" | jq -e . >/dev/null || {
              echo "::error::update-path.task-list ${label}: 'genie task list --json' emitted no JSON"
              exit 1
            }
            output="$(run_genie board --json)" || {
              echo "::error::update-path.board ${label}: 'genie board --json' exited non-zero"
              exit 1
            }
            printf '%s' "$output" | jq -e '.columns' >/dev/null || {
              echo "::error::update-path.board ${label}: 'genie board --json' emitted no columns"
              exit 1
            }
            printf 'standalone task/board OK (%s)\n' "$label"
          }

          # The update-side delivery path itself, driven exactly as
          # tests/support/codex-dogfood-harness.ts drives it (argv, request
          # schema, GENIE_RELEASE_DOGFOOD=1, expected exit 2), but on this bare
          # host. Inputs are copied under DOGFOOD_ROOT first because
          # run-musl-dogfood.sh requires every path the candidate touches to be
          # physically contained in that one canonical root.
          publish_local_delivery() {
            local inputs="${ROOT}/runtime-inputs" request output trailer status=0
            rm -rf -- "$inputs"
            mkdir -p "${inputs}/artifact" "${inputs}/manifest" "${inputs}/descriptor" "${inputs}/bundle"
            cp -- "$CANDIDATE_ARTIFACT" "${inputs}/artifact/"
            cp -- "$CANDIDATE_MANIFEST" "${inputs}/manifest/"
            cp -- "$CANDIDATE_DESCRIPTOR" "${inputs}/descriptor/"
            cp -- "${CANDIDATE_DESCRIPTOR}.sigstore.json" "${inputs}/bundle/"
            request="$(jq -cn \
              --arg platform "$PLATFORM" \
              --arg artifact "${inputs}/artifact/$(basename -- "$CANDIDATE_ARTIFACT")" \
              --arg manifest "${inputs}/manifest/$(basename -- "$CANDIDATE_MANIFEST")" \
              --arg descriptor "${inputs}/descriptor/$(basename -- "$CANDIDATE_DESCRIPTOR")" \
              --arg bundle "${inputs}/bundle/$(basename -- "$CANDIDATE_DESCRIPTOR").sigstore.json" \
              '{schemaVersion: 1, platformId: $platform, artifact: $artifact,
                manifest: $manifest, descriptor: $descriptor, bundle: $bundle}')"
            export GENIE_RELEASE_DOGFOOD=1
            output="$(run_genie update --publish-local-delivery "$request" 2>&1)" || status=$?
            unset GENIE_RELEASE_DOGFOOD
            printf '%s\n' "$output"
            [[ "$status" -eq 2 ]] || {
              echo "::error::update-path.delivery expected exit 2 (delivery published, activation pending), got ${status}"
              exit 1
            }
            trailer="$(printf '%s\n' "$output" | grep -o '{.*}' | tail -n 1)"
            printf '%s' "$trailer" | jq -e '
              .schemaVersion == 1 and .code == "activation-pending" and
              .deliveryComplete == true and .retry == false and (.nextAction | length) > 0
            ' >/dev/null || {
              echo "::error::update-path.delivery trailer is not the activation-pending delivery contract: ${trailer}"
              exit 1
            }
            printf 'genie update --publish-local-delivery -> exit 2 %s\n' "$trailer"
          }

          SEEDED="${ROOT}/repos/seeded"
          UNTOUCHED="${ROOT}/repos/untouched"
          init_repo "$SEEDED"
          init_repo "$UNTOUCHED"

          # 4. N is the active parent and works standalone.
          install_generation "$PREVIOUS_ARTIFACT" "$PREVIOUS_VERSION"
          cd "$SEEDED"
          assert_version "$PREVIOUS_VERSION"
          assert_capabilities "$PREVIOUS_VERSION"
          assert_standalone "previous stable N"

          # 5. The update: the live generation becomes the verified candidate.
          install_generation "$CANDIDATE_ARTIFACT" "$CANDIDATE_VERSION"
          assert_version "$CANDIDATE_VERSION"
          assert_capabilities "$CANDIDATE_VERSION"
          assert_standalone "candidate T over a repository seeded under N"

          # 6. The update-side delivery path, on a host with no Codex at all.
          publish_local_delivery

          cd "$UNTOUCHED"
          assert_standalone "candidate T in an untouched repository"

          mkdir -p "${RUNNER_TEMP}/update-path-evidence"
          printf '{"schemaVersion":1,"platform":"%s","previous":"%s","candidate":"%s","channel":"%s","execution":"%s"}\n' \
            "$PLATFORM" "$PREVIOUS_VERSION" "$CANDIDATE_VERSION" "$CANDIDATE_CHANNEL" \
            "${EXECUTION_ADAPTER:-host-native}" \
            >"${RUNNER_TEMP}/update-path-evidence/update-path-${PLATFORM}.json"

      - name: Upload update-path evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-update-path-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/update-path-evidence
          if-no-files-found: warn
          retention-days: 30

  stable-release-security-gate:
    name: Independent candidate security gate
    needs: [prepare-delivery-evidence, attest-delivery-evidence, delivery-evidence-compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Reject missing prerequisite evidence
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare-delivery-evidence.result }}
          ATTEST_RESULT: ${{ needs.attest-delivery-evidence.result }}
          COMPATIBILITY_RESULT: ${{ needs.delivery-evidence-compatibility.result }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_RESULT" == success &&
             "$ATTEST_RESULT" == success &&
             "$COMPATIBILITY_RESULT" == success ]] || {
            echo "::error::security gate prerequisites are incomplete"
            exit 1
          }

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Security policy is evaluated from protected main, independently of
          # the candidate payload and independently of the dogfood result.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install trusted security-gate dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install cosign for exact candidate verification
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install slsa-verifier for exact candidate verification
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download all exact signed candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: genie-*-signed
          merge-multiple: true
          path: security-gate/dist

      - name: Download exact candidate manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-candidate-manifests
          path: security-gate/manifests

      - name: Download manifest-derived candidate matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-dogfood-candidate-matrix
          path: security-gate

      - name: Verify exact candidate identity with independent release controls
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          CONTROL_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_MANIFEST_NAME: ${{ needs.prepare-delivery-evidence.outputs.candidate_manifest_name }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare-delivery-evidence.outputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          MANIFEST="security-gate/manifests/${CANDIDATE_MANIFEST_NAME}"
          [[ -f "$MANIFEST" && ! -L "$MANIFEST" && -s "$MANIFEST" ]]
          [[ "$(sha256sum "$MANIFEST" | cut -d ' ' -f 1)" == "$EXPECTED_MANIFEST_SHA256" ]]
          bun scripts/candidate-dogfood-matrix.ts \
            --manifest "$MANIFEST" \
            --artifact-dir security-gate/dist \
            --output security-gate/rederived-matrix.json
          cmp -- security-gate/candidate-dogfood-matrix.json security-gate/rederived-matrix.json
          jq -e --arg version "$VERSION" --arg channel "$CHANNEL" --arg digest "$EXPECTED_MANIFEST_SHA256" '
            all(.include[];
              .version == $version and
              .channel == $channel and
              .manifestSha256 == $digest)
          ' security-gate/rederived-matrix.json >/dev/null
          mkdir -p security-gate/verified
          while IFS= read -r artifact; do
            artifact_path="security-gate/dist/${artifact}"
            artifact_sha256="$(jq -er --arg artifact "$artifact" '
              [.include[] | select(.artifact == $artifact) | .artifactSha256] |
              if length == 1 then .[0] else error("candidate artifact is not unique") end
            ' security-gate/rederived-matrix.json)"
            [[ "$(sha256sum "$artifact_path" | cut -d ' ' -f 1)" == "$artifact_sha256" ]]
            bash scripts/verify-release.sh --local "$artifact_path"
            verified_provenance="${RUNNER_TEMP}/${artifact}.verified-provenance.json"
            slsa-verifier verify-artifact "$artifact_path" \
              --provenance-path "${artifact_path}.intoto.jsonl" \
              --source-uri "github.com/${RELEASE_REPOSITORY}" \
              --source-branch main \
              --print-provenance > "$verified_provenance"
            generic_identity="${RUNNER_TEMP}/${artifact}.generic-identity.json"
            ARTIFACT_SHA256="$artifact_sha256" \
              bash scripts/release-generic-provenance.sh verify-exact-subject "$verified_provenance" \
              > "$generic_identity"
            native_result="${RUNNER_TEMP}/${artifact}.native-result.json"
            gh attestation verify "$artifact_path" \
              --repo "$RELEASE_REPOSITORY" \
              --predicate-type "https://github.com/${RELEASE_REPOSITORY}/release-tarballs/v1" \
              --cert-identity "https://github.com/${RELEASE_REPOSITORY}/.github/workflows/sign-attest.yml@refs/heads/main" \
              --source-ref refs/heads/main \
              --source-digest "$CONTROL_SHA" \
              --signer-digest "$CONTROL_SHA" \
              --format json > "$native_result"
            native_identity="${RUNNER_TEMP}/${artifact}.native-identity.json"
            ARTIFACT_SHA256="$artifact_sha256" \
              bash scripts/release-native-predicate.sh verify-exact-subject "$native_result" \
              > "$native_identity"
            # The generic SLSA provenance carries the TRIGGERING workflow_run for
            # automated channels — CI's head commit, one before the
            # [auto-version] bump the tarballs are built from. Only the stable
            # dispatch records SOURCE_SHA itself. The native predicate always
            # records SOURCE_SHA, so it stays compared against it below.
            if [[ "$CHANNEL" == "stable" ]]; then
              generic_expected_sha="$SOURCE_SHA"
            else
              generic_expected_sha="$TRIGGER_SHA"
            fi
            jq -cn \
              --arg artifact "$artifact" \
              --slurpfile generic "$generic_identity" \
              --slurpfile native "$native_identity" \
              --arg sourceSha "$SOURCE_SHA" \
              --arg genericSourceSha "$generic_expected_sha" \
              --arg sourceBranch "$SOURCE_BRANCH" \
              --arg sourceCiRunId "$SOURCE_CI_RUN_ID" \
              --arg controlSha "$CONTROL_SHA" \
              '
                ($generic[0] | [
                  .sourceSha == $genericSourceSha,
                  .sourceBranch == $sourceBranch,
                  .sourceCiRunId == $sourceCiRunId,
                  .controlSha == $controlSha
                ] | all) or error("generic provenance identity disagreement") |
                ($native[0] | [
                  .sourceSha == $sourceSha,
                  .sourceBranch == $sourceBranch,
                  .sourceCiRunId == $sourceCiRunId,
                  .controlSha == $controlSha
                ] | all) or error("native predicate identity disagreement") |
                ($generic[0].artifactSha256 == $native[0].artifactSha256) or
                  error("generic/native artifact digest disagreement") |
                {
                  artifact: $artifact,
                  artifactSha256: $native[0].artifactSha256,
                  generic: $generic[0],
                  native: $native[0]
                }
              ' > "security-gate/verified/${artifact}.json"
          done < <(jq -er '.include[].artifact' security-gate/rederived-matrix.json)
          bun test \
            scripts/release-guard.test.ts \
            scripts/install-swap.test.ts \
            scripts/verify-release.test.ts \
            scripts/build-delivery-evidence.test.ts \
            scripts/verify-delivery-evidence-pack.test.ts \
            scripts/candidate-dogfood-matrix.test.ts \
            scripts/release-generic-provenance.test.ts \
            scripts/release-native-predicate.test.ts
          jq -cs \
            --slurpfile matrix security-gate/rederived-matrix.json \
            --arg candidateManifestSha256 "$EXPECTED_MANIFEST_SHA256" \
            --arg matrixSha256 "$(sha256sum security-gate/rederived-matrix.json | cut -d ' ' -f 1)" \
            '
              sort_by(.artifact) as $entries |
              if ($entries | length) != ($matrix[0].include | length) then
                error("verified security entry count differs from candidate matrix")
              else
                {
                  schemaVersion: 1,
                  kind: "stable-release-security-gate",
                  version: ([$entries[].native.version] | unique |
                    if length == 1 then .[0] else error("verified version disagreement") end),
                  channel: ([$entries[].native.channel] | unique |
                    if length == 1 then .[0] else error("verified channel disagreement") end),
                  sourceSha: ([$entries[].native.sourceSha] | unique |
                    if length == 1 then .[0] else error("verified source SHA disagreement") end),
                  sourceBranch: ([$entries[].native.sourceBranch] | unique |
                    if length == 1 then .[0] else error("verified source branch disagreement") end),
                  sourceCiRunId: ([$entries[].native.sourceCiRunId] | unique |
                    if length == 1 then .[0] else error("verified source run disagreement") end),
                  controlSha: ([$entries[].native.controlSha] | unique |
                    if length == 1 then .[0] else error("verified control SHA disagreement") end),
                  invocationId: ([$entries[].native.invocationId] | unique |
                    if length == 1 then .[0] else error("verified signer run disagreement") end),
                  candidateManifestSha256: $candidateManifestSha256,
                  matrixSha256: $matrixSha256,
                  entries: $entries
                }
              end
            ' security-gate/verified/*.json > security-gate/stable-release-security-gate.json

      - name: Upload independent security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-release-security-gate
          path: security-gate/stable-release-security-gate.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to GitHub Releases
    needs:
      - admit
      - attest-delivery-evidence
      - delivery-evidence-compatibility
      - codex-dogfood-completeness
      - skills-install-smoke
      - release-update-path-smoke
      - stable-release-security-gate
    if: >-
      ${{
        always() &&
        needs.admit.result == 'success' &&
        needs.attest-delivery-evidence.result == 'success' &&
        needs.delivery-evidence-compatibility.result == 'success' &&
        needs.codex-dogfood-completeness.result == 'success' &&
        needs.skills-install-smoke.result == 'success' &&
        needs.release-update-path-smoke.result == 'success' &&
        needs.stable-release-security-gate.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download all signed artifacts (sign-attest.yml)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: genie-*-signed
          merge-multiple: true
          path: dist

      - name: Download canonical delivery descriptor subjects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-descriptors
          path: dist

      - name: Download all delivery endorsement bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: delivery-endorsement-*
          merge-multiple: true
          path: dist

      - name: Download exact candidate manifests for inventory binding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-candidate-manifests
          path: ${{ runner.temp }}/candidate-manifests

      # Channel is NOT resolved here: admit already rejects an empty/unknown
      # channel, and finalize/manifests read inputs.channel raw. A local
      # default would only let publish upload a stable-sized inventory that
      # finalize then aborts on, leaving a published-but-unfinalized release.
      - name: Resolve version + asset inventory
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          TARBALLS=( genie-*.tar.gz )
          if [[ ${#TARBALLS[@]} -eq 0 ]]; then
            echo "::error::no signed tarballs downloaded from upstream run"
            ls -la
            exit 1
          fi
          # Naming contract from sign-attest.yml output: genie-<VERSION>-<PLATFORM>.tar.gz
          # where PLATFORM ∈ {linux-x64-glibc, linux-x64-musl, linux-arm64, darwin-arm64}.
          FIRST="${TARBALLS[0]}"
          PARSED=$(echo "${FIRST}" | sed -E 's/^genie-(.+)-(linux-x64-glibc|linux-x64-musl|linux-arm64|darwin-arm64)\.tar\.gz$/\1/')
          if [[ -z "${PARSED}" || "${PARSED}" == "${FIRST}" ]]; then
            echo "::error::could not parse VERSION from filename '${FIRST}'"
            exit 1
          fi
          VERSION="${PARSED}"
          if [[ -n "${INPUT_VERSION:-}" && "${INPUT_VERSION}" != "${VERSION}" ]]; then
            echo "::error::workflow_dispatch input version='${INPUT_VERSION}' does not match upstream artifact version='${VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: VERSION=${VERSION}"
          echo "Tarballs: ${#TARBALLS[@]}"
          echo "=== dist/ exact inventory: 12 release assets plus selected-channel delivery evidence fanout ==="
          ls -la

      - name: Install cosign for published-asset reuse verification
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install slsa-verifier for published-asset reuse verification
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Prepare draft and reconcile exact endorsed assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DRAFT: ${{ inputs.draft }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_MANIFEST_DIR: ${{ runner.temp }}/candidate-manifests
        shell: bash
        run: |
          set -euo pipefail
          # New releases remain draft/non-latest until every exact asset is
          # remotely verified. Finalize then proves repository immutability
          # before the endorsed manifest bytes may be reconciled.
          # Existing complete releases are reused byte for
          # byte; partial published releases and mismatches fail closed. The
          # repository setting is an externally verified cutover prerequisite:
          # GITHUB_TOKEN cannot read the Administration API that exposes it.
          bash scripts/reconcile-release-note.sh prepare
          bash scripts/reconcile-release-assets.sh

  manifests:
    name: Advance authoritative channel manifests
    needs: finalize
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      # No reviewers: dev stays automatic. The environment is restricted
      # to main and holds the sole credential (the RELEASE_MANIFESTS App key)
      # allowed to push the .well-known manifests through the main ruleset.
      name: release-manifests
    permissions:
      contents: read
    # -----------------------------------------------------------------------
    # HUMAN SETUP (one-time) — the manifest push authenticates as a GitHub
    # App, NOT a PAT and NOT a deploy key.
    #
    # History: deploy keys are DISABLED org-wide (repos/automagik-dev/genie/keys
    # POST → 422 "Deploy keys are disabled"), so the ssh-key model silently fell
    # back to github-actions[bot], whose push to protected main 403s. Replacing
    # it with a fine-grained PAT did not help either: the `main` ruleset
    # (id 9203218) carries a `pull_request` rule with an EMPTY bypass_actors
    # list, so *every* direct push to main is rejected GH013 regardless of the
    # token's contents:write scope. A ruleset bypass is required, and an App is
    # the narrowest identity that can hold one — granting it to a RepositoryRole
    # would hand every admin direct push to main.
    #
    # To provision (repo/org admin):
    #   1. Create an org-owned GitHub App (suggested name: genie-release-bot)
    #      with Repository permissions → Contents: Read and write (nothing
    #      else). Generate a private key.
    #   2. Install it on automagik-dev/genie ONLY (no other repositories).
    #   3. Store its credentials as environment secrets in the
    #      `release-manifests` environment (Settings → Environments):
    #      RELEASE_MANIFESTS_APP_ID and RELEASE_MANIFESTS_APP_PRIVATE_KEY.
    #   4. Add the App as a bypass actor on the `main` ruleset:
    #      gh api repos/automagik-dev/genie/rulesets/9203218 -X PUT \
    #        -f 'bypass_actors[][actor_type=Integration]' \
    #        -F 'bypass_actors[][actor_id]=<APP_ID>' \
    #        -f 'bypass_actors[][bypass_mode]=always'
    #      Without this the push fails GH013 exactly as the PAT did.
    #   5. Delete the now-unused RELEASE_MANIFESTS_TOKEN and any stale
    #      RELEASE_MANIFESTS_DEPLOY_KEY environment secret.
    #
    # The App token is minted per run and expires in ~1h, so no long-lived
    # push credential to main exists anywhere.
    # (Kept in the workflow header because docs/ is a submodule; mirror this
    #  into docs/release-process.mdx when that submodule is next updated.)
    # -----------------------------------------------------------------------
    steps:
      - name: Preflight — require the manifest push App credentials
        env:
          RELEASE_MANIFESTS_APP_ID: ${{ secrets.RELEASE_MANIFESTS_APP_ID }}
          RELEASE_MANIFESTS_APP_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFESTS_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${RELEASE_MANIFESTS_APP_ID:-}" ]]; then
            echo "::error::RELEASE_MANIFESTS_APP_ID is not set in the 'release-manifests' environment." >&2
            missing=1
          fi
          if [[ -z "${RELEASE_MANIFESTS_APP_PRIVATE_KEY:-}" ]]; then
            echo "::error::RELEASE_MANIFESTS_APP_PRIVATE_KEY is not set in the 'release-manifests' environment." >&2
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "::error::Without App credentials actions/checkout silently falls back to github-actions[bot], whose push to protected main is rejected (misreported below as a CAS race)." >&2
            echo "::error::Fix: create an org-owned App with contents:read+write on automagik-dev/genie only, store its id/private key as the RELEASE_MANIFESTS_APP_ID and RELEASE_MANIFESTS_APP_PRIVATE_KEY environment secrets, and add the App as an Integration bypass actor on the 'main' ruleset. See this job's HUMAN SETUP header." >&2
            exit 1
          fi

      - name: Mint a short-lived App token for the manifest push
        id: manifest_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_MANIFESTS_APP_ID }}
          private-key: ${{ secrets.RELEASE_MANIFESTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ steps.manifest_app_token.outputs.token }}
          persist-credentials: true

      - name: Download the exact pre-endorsed candidate manifest bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-candidate-manifests
          path: ${{ runner.temp }}/candidate-manifests

      # ---------------------------------------------------------------------
      # Per-channel manifest pointers — committed to main so install.sh +
      # `genie update` can resolve the current version for each channel via:
      #   curl -fsSL https://raw.githubusercontent.com/automagik-dev/genie/main/.well-known/<channel>.json
      #
      # Filename map (per wish release-channel-dev, 2026-05-11):
      #   stable → latest.json     (kept for back-compat with v1 manifest layout)
      #   dev    → dev.json        (replaces the old "next.json" producer concept)
      #
      # The stable-only gate that lived here through v4.260511.3 was lifted —
      # every non-draft publish writes the manifest(s) for the channel(s) it
      # advances. A stable release ALSO advances dev (single-pipeline reality:
      # there is no dev-only release path today — every release is the latest
      # of both channels). When a dev-only pipeline lands later, channel=dev
      # writes ONLY dev.json and latest.json stays at the prior stable.
      # ---------------------------------------------------------------------
      - name: Update channel manifests (.well-known/*.json — non-draft only)
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "release-bot@namastex.com"
          # Preserve the helper from this admitted control commit. Each retry
          # evaluates it against a freshly fetched main tree; a concurrent
          # writer can cause a non-fast-forward, never a lost/downgraded update.
          MANIFEST_RECONCILER="${RUNNER_TEMP}/reconcile-channel-manifests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          cp scripts/reconcile-channel-manifests.sh "$MANIFEST_RECONCILER"
          CANDIDATE_MANIFEST_DIR="${RUNNER_TEMP}/candidate-manifests"
          manifests_reconciled=false

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git switch --detach origin/main

            # Stable fans out to the downstream dev pointer, but each file
            # moves independently and monotonically. An older delayed release
            # may advance stable while preserving newer downstream pointers.
            RELEASE_REPOSITORY="${{ github.repository }}" CANDIDATE_MANIFEST_DIR="$CANDIDATE_MANIFEST_DIR" \
              bash "$MANIFEST_RECONCILER"

            # Stage the complete fixed allowlist. Staging before diff handles
            # both modified and bootstrap/untracked manifests.
            MANIFEST_PATHS=()
            for f in latest.json dev.json; do
              [[ -f ".well-known/${f}" && ! -L ".well-known/${f}" ]] && MANIFEST_PATHS+=(".well-known/${f}")
            done
            git add -- "${MANIFEST_PATHS[@]}"
            if git diff --cached --quiet HEAD -- "${MANIFEST_PATHS[@]}"; then
              echo "manifests already monotonic — nothing to commit"
              manifests_reconciled=true
              break
            fi
            git commit -m "chore(release): advance eligible manifests (${CHANNEL}) → v${VERSION} [release-manifest]"
            # Classify the push failure: a non-fast-forward is a genuine CAS
            # race worth retrying; a permission/branch-protection rejection is
            # NOT — retry-looping on it just wastes 5 attempts and misreports a
            # 403 as "lost a concurrent main update" (the historic misdiagnosis
            # that hid the missing-credential bug). Fail loudly and immediately.
            if push_output="$(git push origin "HEAD:refs/heads/main" 2>&1)"; then
              printf '%s\n' "$push_output"
              manifests_reconciled=true
              break
            fi
            printf '%s\n' "$push_output" >&2
            if printf '%s' "$push_output" | grep -qiE 'protected branch|GH006|permission to .* denied|not authorized|403|forbidden|remote rejected'; then
              echo "::error::manifest push to main was REJECTED for lack of permission — this is NOT a concurrent-update CAS race. Either the RELEASE_MANIFESTS App lacks contents:write on ${GITHUB_REPOSITORY}, or it is not a bypass actor on the 'main' ruleset (an empty bypass_actors list rejects every direct push GH013). See this job's HUMAN SETUP header." >&2
              exit 1
            fi
            echo "::warning ::release-manifest.cas_retry attempt ${attempt}/5: non-fast-forward from a concurrent main update; recomputing"
          done

          if [[ "$manifests_reconciled" != true ]]; then
            echo "::error::manifest push to main failed after 5 monotonic retries; release pointer was not advanced"
            exit 1
          fi

  finalize:
    name: Finalize immutable release before manifest publication
    needs: publish
    if: ${{ !inputs.draft && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download all signed artifacts (sign-attest.yml)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: genie-*-signed
          merge-multiple: true
          path: dist

      - name: Download canonical delivery descriptor subjects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-descriptors
          path: dist

      - name: Download all delivery endorsement bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: delivery-endorsement-*
          merge-multiple: true
          path: dist

      - name: Download exact candidate manifests for final inventory binding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-candidate-manifests
          path: ${{ runner.temp }}/candidate-manifests

      - name: Install cosign for final remote verification
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install slsa-verifier for final remote verification
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Publish, lock, and reverify the complete remote inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DRAFT: ${{ inputs.draft }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_MANIFEST_DIR: ${{ runner.temp }}/candidate-manifests
        run: |
          set -euo pipefail
          bash scripts/reconcile-release-note.sh finalize
          # Every channel owns a fresh tag. Publish and lock the exact verified
          # inventory before any public manifest can name it.
          bash scripts/release-immutability.sh release
          bash scripts/reconcile-release-assets.sh
