name: Musl Adapter Smoke

# The Alpine execution adapter historically ran ONLY inside production release
# dogfood jobs, so every adapter defect cost a full release cycle to discover
# (docker pull noise on the stderr-strict probe, container-root vs host-uid git
# ownership). This smoke exercises the adapter on a real amd64 runner with the
# real previous-stable musl binary on every PR that touches it: seeding a git
# repository through the container exactly as the dogfood harness does, and
# asserting the probe's contract — exit 0 with a byte-empty stderr.
on:
  pull_request:
    paths:
      - 'scripts/run-musl-dogfood.sh'
      - '.github/workflows/musl-adapter-smoke.yml'

permissions:
  contents: read
  actions: read

jobs:
  # Full-fidelity replay of the dogfood musl entry against the exact artifact
  # set of a real failed release run — the real entry-runner, adapter, Codex,
  # and inputs, executing in PR checks instead of costing a release cycle per
  # observation. The pinned run id is updated when investigating a new failure.
  replay:
    name: Replay the dogfood musl entry from run 30220567504
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install trusted harness dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned real Codex app-server
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.144.1
          CODEX_PATH="$(node -e 'console.log(require("node:fs").realpathSync(process.argv[1]))' "$(command -v codex)")"
          echo "GENIE_DOGFOOD_REAL_CODEX=${CODEX_PATH}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install slsa-verifier (platform-correct, pinned)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/slsa-verifier-bin"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64"
          echo "946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339  ${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier" | shasum -a 256 -c -
          chmod +x "${RUNNER_TEMP}/slsa-verifier-bin/slsa-verifier"
          echo "${RUNNER_TEMP}/slsa-verifier-bin" >> "$GITHUB_PATH"

      - name: Allow the Codex bubblewrap sandbox to configure its network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pre-pull the pinned Alpine image
        run: docker pull -q 'alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1'

      - name: Download the failed run's exact inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=30220567504
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n codex-dogfood-previous-release -D dogfood-entry/inputs/previous
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n genie-5.260726.11-linux-x64-musl-signed -D dogfood-entry/inputs/candidate
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n delivery-candidate-manifests -D dogfood-entry/inputs/candidate/manifests
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n delivery-descriptors -D dogfood-entry/inputs/candidate/descriptors
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n delivery-endorsement-dev-linux-x64-musl -D dogfood-entry/inputs/candidate/descriptors

      - name: Run the exact entry the dogfood job runs
        env:
          PLATFORM: linux-x64-musl
          PREVIOUS_VERSION: 5.260720.10
          CANDIDATE_VERSION: 5.260726.11
        run: |
          set -euo pipefail
          PREVIOUS_ARTIFACT="dogfood-entry/inputs/previous/genie-${PREVIOUS_VERSION}-${PLATFORM}.tar.gz"
          CANDIDATE_ARTIFACT="dogfood-entry/inputs/candidate/genie-${CANDIDATE_VERSION}-${PLATFORM}.tar.gz"
          CANDIDATE_DESCRIPTOR="dogfood-entry/inputs/candidate/descriptors/genie-${CANDIDATE_VERSION}-${PLATFORM}.tar.gz.dev.delivery.json"
          bun tests/support/codex-dogfood-entry-runner.ts \
            --previous-artifact "$PREVIOUS_ARTIFACT" \
            --previous-manifest dogfood-entry/inputs/previous/manifest.json \
            --previous-bundle "${PREVIOUS_ARTIFACT}.bundle" \
            --previous-provenance "${PREVIOUS_ARTIFACT}.intoto.jsonl" \
            --candidate-artifact "$CANDIDATE_ARTIFACT" \
            --candidate-manifest dogfood-entry/inputs/candidate/manifests/dev.json \
            --candidate-descriptor "$CANDIDATE_DESCRIPTOR" \
            --candidate-bundle "${CANDIDATE_DESCRIPTOR}.sigstore.json" \
            --platform-id "$PLATFORM" \
            --output-evidence dogfood-entry/codex-dogfood-replay.md \
            --execution-adapter "$PWD/scripts/run-musl-dogfood.sh"

  smoke:
    name: Seed a repository through the Alpine adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Pre-pull the pinned Alpine image (mirrors the dogfood job)
        run: docker pull -q 'alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1'

      - name: Download the previous-stable musl release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="v$(jq -r '.version' .well-known/latest.json 2>/dev/null || true)"
          if [[ "$PREVIOUS_TAG" == "v" || "$PREVIOUS_TAG" == "vnull" ]]; then
            echo "::error::could not resolve the previous stable version from .well-known/latest.json"
            exit 1
          fi
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "genie-*-linux-x64-musl.tar.gz" --dir "$RUNNER_TEMP/previous"

      - name: Probe-mode contract — exit 0 with a byte-empty stderr
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/dogfood-root"
          mkdir -p "$ROOT/repos/a" "$ROOT/home" "$ROOT/genie-home/bin" "$ROOT/tmp" "$ROOT/n-extract"
          tar -xzf "$RUNNER_TEMP"/previous/genie-*-linux-x64-musl.tar.gz -C "$ROOT/n-extract"
          cp "$ROOT/n-extract/genie" "$ROOT/genie-home/bin/genie"
          chmod 755 "$ROOT/genie-home/bin/genie"
          cp "$ROOT/n-extract/VERSION" "$ROOT/genie-home/bin/VERSION" || true
          # The harness's verifyCapability runs the adapter WITHOUT DOGFOOD_ROOT
          # (candidate mounted read-only at /candidate) and rejects any stderr
          # byte. --version is quiet on every generation, so bootstrap noise
          # (docker pull progress, apk output) is the only thing that could
          # reach stderr — exactly the class this contract pins.
          status=0
          HOME="$ROOT/home" TMPDIR="$ROOT/tmp" TERM=xterm \
            bash scripts/run-musl-dogfood.sh "$ROOT/genie-home/bin/genie" --version \
            >"$RUNNER_TEMP/probe-out" 2>"$RUNNER_TEMP/probe-err" || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::error::probe-mode adapter invocation exited ${status}"
            cat "$RUNNER_TEMP/probe-out" "$RUNNER_TEMP/probe-err"
            exit 1
          fi
          if [[ -s "$RUNNER_TEMP/probe-err" ]]; then
            echo "::error::probe-mode adapter invocation wrote stderr (the capability probe fails on any stderr byte):"
            cat "$RUNNER_TEMP/probe-err"
            exit 1
          fi
          grep -q . "$RUNNER_TEMP/probe-out" || { echo "::error::--version produced no output"; exit 1; }

      - name: Stateful-mode seeding — the exact leg that failed in v5.260726.9
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/dogfood-root"
          git init -q -b main "$ROOT/repos/a"
          ADAPTER="$PWD/scripts/run-musl-dogfood.sh"
          cd "$ROOT/repos/a"
          run_via_adapter() {
            local status=0
            DOGFOOD_ROOT="$ROOT" HOME="$ROOT/home" GENIE_HOME="$ROOT/genie-home" \
              TMPDIR="$ROOT/tmp" GENIE_RELEASE_DOGFOOD=1 TERM=xterm \
              bash "$ADAPTER" "$ROOT/genie-home/bin/genie" "$@" \
              >"$RUNNER_TEMP/cli-out" 2>"$RUNNER_TEMP/cli-err" || status=$?
            if [[ "$status" -ne 0 ]]; then
              echo "::error::adapter invocation 'genie $*' exited ${status}"
              cat "$RUNNER_TEMP/cli-out" "$RUNNER_TEMP/cli-err"
              exit 1
            fi
            cat "$RUNNER_TEMP/cli-out"
          }
          run_via_adapter init
          run_via_adapter task create --title smoke-sentinel --wish smoke
          run_via_adapter board
          # The database seeded through the container must be owned by the
          # runner user, or every later host-side stage fails closed on
          # genie's stat.uid ownership checks.
          [[ "$(stat -c %u "$ROOT/repos/a/.genie/genie.db")" == "$(id -u)" ]] || {
            echo "::error::container-created database is not owned by the host user"
            exit 1
          }
          echo "adapter smoke: OK"

      - name: Real-PTY setup — the exact leg that failed in v5.260726.11
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/dogfood-root"
          mkdir -p "$ROOT/codex-home"
          ADAPTER="$PWD/scripts/run-musl-dogfood.sh"
          cd "$ROOT/repos/a"
          # Mirror capturePtySetup's Linux path byte for byte: script(1)
          # allocates a real PTY, stdin feeds the confirmation, CI is emptied
          # so setup believes it is interactive. Unlike the harness, capture
          # BOTH streams to files so a failure shows the actual error instead
          # of an echoed "yes".
          status=0
          DOGFOOD_ROOT="$ROOT" HOME="$ROOT/home" GENIE_HOME="$ROOT/genie-home" \
            CODEX_HOME="$ROOT/codex-home" TMPDIR="$ROOT/tmp" \
            GENIE_RELEASE_DOGFOOD=1 TERM=xterm CI= CODEX_THREAD_ID= \
            script -qec "'$ADAPTER' '$ROOT/genie-home/bin/genie' setup --codex" /dev/null \
            <<<'yes' >"$RUNNER_TEMP/pty-out" 2>"$RUNNER_TEMP/pty-err" || status=$?
          echo "--- pty stdout:"; cat "$RUNNER_TEMP/pty-out"
          echo "--- pty stderr:"; cat "$RUNNER_TEMP/pty-err"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::real-PTY setup through the adapter exited ${status}"
            exit 1
          fi
          echo "pty smoke: OK"
