name: Docs Lint

# Lints markdown sources and checks that every link in the runbook + SECURITY.md
# still resolves. Enforced as a merge gate on any PR touching these files so the
# incident-response prose does not rot with broken references.
#
# Tools:
#   - markdownlint-cli2 (configured via .markdownlint-cli2.jsonc) — structural
#     markdown issues, code-fence hygiene, bare URLs, list formatting.
#   - markdown-link-check — verifies internal anchors and external URLs. Run
#     with a config that retries on 429/5xx and allows the GitHub user-agent
#     so shortlink checks don't false-fail in CI.
#   - a retired-terminology grep over docs/ (wish `skills-everywhere-c`, C10).
#     It lives here, and NOT in `bun run check`, because `docs/` is a symlink
#     into the .docs-vendor submodule: a contributor with an unpopulated
#     submodule would see a false failure locally, while every job in this
#     workflow checks out with `submodules: recursive` and is guaranteed a
#     populated tree. Known blind spot (wish Decision 11): the assertion reads
#     docs/ at the pinned submodule commit, so a violation landed on docs `main`
#     after the last pointer bump is invisible until the next bump.

on:
  push:
    branches: [main, dev]
    paths:
      - 'SECURITY.md'
      # Docs live in the .docs-vendor submodule (automagik-dev/docs); trigger
      # on submodule pointer bumps so docs lint runs whenever genie picks up
      # a new docs commit. That is also how a new page (docs/release-notes.mdx)
      # reaches this workflow — it arrives with the pointer bump.
      - '.docs-vendor'
      - '.gitmodules'
      - '.markdownlint-cli2.jsonc'
      - '.github/markdown-link-check.json'
      # package.json carries the lint:docs-markdown / lint:docs-links target
      # lists, so editing which pages are linted must re-run this workflow.
      - 'package.json'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'SECURITY.md'
      - '.docs-vendor'
      - '.gitmodules'
      - '.markdownlint-cli2.jsonc'
      - '.github/markdown-link-check.json'
      - 'package.json'
      - '.github/workflows/docs-lint.yml'

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install locked docs tooling
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint SECURITY.md + runbook + install/release-notes pages
        run: bun run lint:docs-markdown

  link-check:
    name: markdown-link-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install locked docs tooling
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify links in SECURITY.md + runbook + install/release-notes pages
        run: bun run lint:docs-links

  # Wish `skills-everywhere-c`, criterion C10-docs. The token list is RETIRED-9
  # plus the docs-only `plugin marketplace add` bootstrap step; the pattern below
  # is byte-identical to the wish's Group 3 validation grep — one list, two call
  # sites. Needs no toolchain, only a populated submodule, so it does not install
  # bun or node.
  retired-terminology:
    name: Retired terminology (docs/)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Assert docs/ names no retired subsystem
        run: |
          set -euo pipefail
          if grep -rnE 'setup --codex|agent-sync|H3/H4/H6|\.curated|LENS_ROOT|CLAUDE_PLUGIN_ROOT|genie@automagik|council\.js|hook dispatch|plugin marketplace add' docs/; then
            echo "::error::docs-lint: docs/ still names retired Genie machinery (matches above). Rewrite the page; the terminology contract is wish skills-everywhere-c, criterion C10-docs."
            exit 1
          fi
          echo "docs/ carries no retired terminology"
