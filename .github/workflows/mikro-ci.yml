name: Mikro CI

on:
  push:
    branches: [main, dev]
    paths: ['mikro/**', '.github/workflows/mikro-ci.yml']
  pull_request:
    branches: [main, dev]
    paths: ['mikro/**', '.github/workflows/mikro-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mikro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Mikro npm/Node package gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mikro
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: mikro/package-lock.json
      - name: Install locked npm dependencies
        run: npm run deps:ci
      - name: Build committed distribution
        run: npm run build
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm test
      - name: Install/update contract smoke
        run: bash scripts/smoke-install-update.sh
