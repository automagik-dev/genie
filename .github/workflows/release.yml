name: Release

# Release orchestrator: build -> sign-attest -> publish. Automated dev releases
# are called by version.yml with the exact tag SHA and source CI run; stable is
# a manual dispatch. There is no approval step and no caller/provenance guard
# (owner decision 2026-11-05): signing, the signed delivery evidence and the
# production-verifier compatibility check are the release's remaining checks.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for example 6.260919.1, without a v prefix)'
        required: true
        type: string
      channel:
        description: 'Release channel (stable is the only manual channel)'
        required: true
        type: choice
        options:
          - stable
      source_sha:
        description: 'Exact commit SHA to build (the v<version> commit for dev)'
        required: true
        type: string
      source_branch:
        description: 'Branch on the successful source CI run'
        required: true
        type: choice
        options:
          - main
          - dev
      trigger_sha:
        description: 'Head SHA of the admitting CI run (automated channels only; source_sha is the built commit)'
        required: false
        type: string
        default: ''
      source_ci_run_id:
        description: 'Authorizing CI run ID (exact promotion SHA, or parent of a deterministic dev version child)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version without a v prefix'
        required: true
        type: string
      channel:
        description: 'Automated release channel'
        required: true
        type: string
      source_sha:
        description: 'Exact commit SHA to build'
        required: true
        type: string
      source_branch:
        description: 'Branch on the successful source CI run'
        required: true
        type: string
      trigger_sha:
        description: 'Head SHA of the admitting CI run (automated channels only; source_sha is the built commit)'
        required: false
        type: string
        default: ''
      source_ci_run_id:
        description: 'Authorizing CI run ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialize retries/promotions of one immutable version. Cross-version runs
  # stay independent; manifest reconciliation is monotonic and CAS-retried.
  group: release-${{ inputs.version }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-tarballs.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      source_sha: ${{ inputs.source_sha }}

  sign-attest:
    needs: build
    if: always() && needs.build.result == 'success'
    uses: ./.github/workflows/sign-attest.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    with:
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      source_sha: ${{ inputs.source_sha }}
      source_branch: ${{ inputs.source_branch }}
      source_ci_run_id: ${{ inputs.source_ci_run_id }}
      trigger_sha: ${{ inputs.trigger_sha }}

  publish:
    needs: sign-attest
    if: always() && needs.sign-attest.result == 'success'
    uses: ./.github/workflows/release-publish.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      source_sha: ${{ inputs.source_sha }}
      source_branch: ${{ inputs.source_branch }}
      source_ci_run_id: ${{ inputs.source_ci_run_id }}
      trigger_sha: ${{ inputs.trigger_sha }}
      draft: false
    # Without inherit, the called workflow's secrets context is empty and the
    # manifests job sees RELEASE_MANIFESTS_APP_ID/_PRIVATE_KEY as unset even
    # though the release-manifests environment holds them (proven on the
    # v5.260720.10 stable run). Local trusted workflow — inherit is safe.
    secrets: inherit
