name: Release Orphan Alert

# Scheduled tag-orphan detector. Every 30 minutes, enumerate v* tags
# pushed in the last 24 hours and check each against the GitHub
# Releases API. If a v* tag is in the [30min, 24h] age window and
# has no corresponding Release, open a release-incident issue.
# The same fire also reconciles the other direction: every OPEN
# release-incident issue whose tag has since gained a Release is
# commented with that Release URL and closed, so the label only ever
# holds incidents that are still true.
#
# The age window is critical: the lower bound (30 min) is the grace
# period for the orchestrator to ship after a tag push; the upper
# bound (24h) excludes the 1000+ historical tags that pre-date the
# signed-release pipeline (v1.0.x era) — without the upper bound,
# every cron fire would file ~12 false-positive issues per second
# until the 5-min timeout cancelled it (genie issues #2211–#2410+,
# 664 open false-positives at the time of this fix).
#
# The orphan signal is the load-bearing alarm for the new
# release.yml workflow_call orchestrator (wish:
# release-pipeline-collapse). If the orchestrator fails between
# tag-push and release-publish, the tag exists but no Release
# follows — historically this took manual operator inspection to
# surface; this workflow makes it automatic.

on:
  # Re-enabled 2026-07-25. The re-enable condition — "verified against
  # a fresh sample of tags" — was met by manual dispatch run 30178531358
  # against the debris of the 2026-07-20..25 release outage: it detected
  # exactly the 8 genuine orphans (v5.260725.1-.8, tags pushed with no
  # Release) and filed issues #2651-#2658, with zero false positives from
  # the 1000+ historical v1.0.x tags the 24h upper bound excludes.
  #
  # That outage is precisely the scenario this alarm exists for: five days
  # of releases died between tag-push and release-publish and nothing
  # surfaced it automatically.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-orphan-alert
  cancel-in-progress: false

jobs:
  detect:
    name: Detect tag-orphans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Scan tags vs releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          NOW_EPOCH=$(date -u +%s)
          AGE_MIN_S=$((30 * 60))          # grace period: alert only after 30 min
          AGE_MAX_S=$((24 * 60 * 60))     # lookback window: ignore tags older than 24h

          # Pull v* tags with their commit date (tagger date for
          # annotated tags; committer date for lightweight tags).
          git fetch --tags origin
          mapfile -t TAGS < <(git tag --list 'v*' --sort=-creatordate)

          # Collect existing releases as `<tag>\t<html_url>` rows. Use the REST
          # API with --paginate to retrieve ALL release pages — `gh release list
          # --limit N` truncates silently, which would misclassify older tags
          # as orphans once the repo exceeds N releases (Codex P1 review on
          # PR #1743 — limit:200 cap had this exact failure mode).
          # The URL column is what the auto-close pass below posts as the
          # evidence for closing an incident; the tag column keeps the
          # whole-word has-release check the orphan loop already used.
          # DRAFTS ARE NOT RELEASES here. release-publish.yml creates every
          # release as a draft and publishes it only after the exact endorsed
          # asset inventory reconciles, and it explicitly admits the case
          # where a tag is left with nothing but a draft (an interrupted
          # publish — release-publish.yml "exists only as a draft release").
          # That tag is precisely the orphan this alarm exists for, and
          # counting the draft would (a) suppress the incident and (b) make
          # the auto-close below terminal: the `--state all` dedup never
          # refiles a title it has already used, so one wrong close would
          # retire the alarm for that version for good.
          RELEASES_TSV=$(gh api --paginate "repos/${REPO}/releases" \
            --jq '.[] | select(.draft == false) | [.tag_name, .html_url] | @tsv')
          RELEASE_TAGS=$(cut -f1 <<<"$RELEASES_TSV" | tr '\n' ' ')

          # ---------------------------------------------------------------
          # Auto-close pass. An incident is filed while a tag has no Release;
          # the release can still land afterwards (a retried orchestrator, a
          # human stable dispatch). Nothing closed those issues, so the label
          # accumulated healed incidents and the alarm lost its signal. Every
          # OPEN release-incident issue whose tag now HAS a Release gets the
          # Release URL commented as the evidence, then gets closed. Closed
          # incidents are never reopened or touched — a closed issue is an
          # operator ack (see the dedup note further down).
          # This runs before the orphan loop's early exit so a cron fire with
          # zero orphans still reconciles the open incidents.
          # The listing must fail loudly under `set -e` for the same reason the
          # dedup lookup does: an empty result read as "nothing open" is a
          # silent no-op, and a transient API error must abort the job.
          # --limit 1000, not the CLI's default 30 or a round 100: the
          # #2211–#2410 era had 664 release-incident issues open at once, and
          # a truncated page would starve the oldest incidents forever — they
          # are exactly the ones whose tags have long since been released.
          # The one-shot receipt is a LABEL written AFTER the close, never the
          # resolution comment: a close that fails once the comment is already
          # posted must not strand the incident open for good (the next fire
          # would read its own comment as "already auto-resolved" and skip it
          # forever). With the label, a failed close leaves no receipt — the
          # next fire retries and the worst case is one duplicate comment —
          # while a failed label edit leaves the issue closed, which is the
          # outcome that mattered. Creating it is covered by `issues: write`.
          RESOLVED_LABEL=release-auto-resolved
          OPEN_INCIDENTS=$(gh issue list --repo "$REPO" \
            --label release-incident --state open --limit 1000 \
            --json number,title,labels \
            --jq '.[] | [.number, .title, ([.labels[].name] | join(","))] | @tsv')

          # Create the receipt label only when this fire is actually about to
          # use it, and only when it does not exist yet. `--force` would
          # rewrite an existing label's description and colour on every fire,
          # overriding an operator who had adjusted them — and it would do so
          # on fires that close nothing at all. Called immediately before the
          # first --add-label; memoized, so the listing costs one read per
          # run at most. The lookup is a herestring, never `gh … | grep -q`:
          # grep -q leaves the pipe early, which under `pipefail` turns a
          # successful match into exit 141 once the label list is large.
          ensure_resolved_label() {
            if [[ "${RESOLVED_LABEL_READY:-0}" -eq 1 ]]; then
              return 0
            fi
            local known_labels lookup_status=0
            known_labels=$(gh label list --repo "$REPO" --limit 200 \
              --json name --jq '.[].name' </dev/null)
            # Fail closed exactly like the issue-title dedup: only status 1
            # means "absent"; any other grep status must abort rather than
            # create a label that may already exist.
            grep -Fxq "$RESOLVED_LABEL" <<<"$known_labels" || lookup_status=$?
            if [[ "$lookup_status" -eq 1 ]]; then
              gh label create "$RESOLVED_LABEL" --repo "$REPO" \
                --description 'Closed automatically by Release Orphan Alert once the tag gained a published Release' \
                --color 0E8A16 </dev/null
            elif [[ "$lookup_status" -ne 0 ]]; then
              echo "::error::label lookup for ${RESOLVED_LABEL} failed with status ${lookup_status}"
              exit "$lookup_status"
            fi
            RESOLVED_LABEL_READY=1
          }

          CLOSED_COUNT=0
          while IFS=$'\t' read -r INCIDENT_NUMBER INCIDENT_TITLE INCIDENT_LABELS; do
            [[ -n "$INCIDENT_NUMBER" && -n "$INCIDENT_TITLE" ]] || continue
            # One shot per issue, read from the listing already fetched — no
            # per-incident API call. Reopening an auto-closed incident is a
            # deliberate operator act (the Release exists but something about
            # it is still wrong); re-commenting and re-closing it every 30
            # minutes would override that human decision forever.
            if [[ ",${INCIDENT_LABELS}," == *",${RESOLVED_LABEL},"* ]]; then
              echo "issue #${INCIDENT_NUMBER} was already auto-resolved once (reopened deliberately); leaving open"
              continue
            fi
            # Recover the tag from the title this workflow itself writes.
            # Anything else carrying the label is left alone.
            INCIDENT_TAG="${INCIDENT_TITLE#release-incident: }"
            INCIDENT_TAG="${INCIDENT_TAG% has no Release object}"
            if [[ "$INCIDENT_TAG" == "$INCIDENT_TITLE" || -z "$INCIDENT_TAG" ]]; then
              echo "issue #${INCIDENT_NUMBER} is not a tag-orphan incident title; leaving open"
              continue
            fi
            # A herestring, never `printf ... | awk ... exit`: awk leaves the
            # pipe early by design, so under `pipefail` the whole step would
            # die with 141 (SIGPIPE) as soon as the releases TSV outgrows one
            # 64 KiB pipe buffer — taking the orphan loop below down with it.
            RELEASE_URL=$(awk -F'\t' -v tag="$INCIDENT_TAG" '$1 == tag { print $2; exit }' <<<"$RELEASES_TSV")
            if [[ -z "$RELEASE_URL" ]]; then
              continue
            fi
            # Strict order: comment (the evidence) → close (the outcome that
            # matters) → label (the receipt that makes it one-shot). Each
            # failure mode then degrades to something recoverable, and
            # `</dev/null` on every call so none can consume the incident list
            # this loop is reading.
            gh issue comment "$INCIDENT_NUMBER" --repo "$REPO" \
              --body "Resolved automatically by Release Orphan Alert: \`${INCIDENT_TAG}\` now has a published GitHub Release — ${RELEASE_URL}" </dev/null
            gh issue close "$INCIDENT_NUMBER" --repo "$REPO" --reason completed </dev/null
            ensure_resolved_label
            gh issue edit "$INCIDENT_NUMBER" --repo "$REPO" --add-label "$RESOLVED_LABEL" </dev/null
            CLOSED_COUNT=$((CLOSED_COUNT + 1))
            # Backlog drain guard. GITHUB_TOKEN is capped at 1,000 REST writes
            # per hour per repository, and the #2211–#2410 era left 664
            # incidents open at once: three writes each would burn the whole
            # budget in one fire and take the orphan filing below down with
            # it. Fifty per fire (150 writes) drains that backlog in a day of
            # cron and leaves the rest of the hour's budget alone.
            if [[ "$CLOSED_COUNT" -ge 50 ]]; then
              echo "::notice::auto-close budget reached (50 issues this fire); the remaining healed incidents close on the next fire"
              break
            fi
          done <<<"$OPEN_INCIDENTS"
          echo "auto-closed ${CLOSED_COUNT} healed release-incident issue(s)"
          # ---------------------------------------------------------------

          ORPHANS=()
          for TAG in "${TAGS[@]}"; do
            # has-release check (whole-word match against the
            # space-delimited list).
            if [[ " ${RELEASE_TAGS} " == *" ${TAG} "* ]]; then
              continue
            fi
            TAG_TS=$(git log -1 --format=%ct "$TAG" 2>/dev/null || echo 0)
            if [[ "$TAG_TS" -eq 0 ]]; then continue; fi
            AGE=$((NOW_EPOCH - TAG_TS))
            # Bounded age window: skip historical tags older than the
            # lookback (they predate the signed-release pipeline and
            # are not actionable) AND skip tags too fresh for the
            # orchestrator to have shipped yet.
            if [[ "$AGE" -lt "$AGE_MIN_S" || "$AGE" -gt "$AGE_MAX_S" ]]; then
              continue
            fi
            # Promotion-tag predicate. version.yml mints a v* tag on exactly
            # two paths:
            #   dev — it rewrites the version fields present, commits the
            #     version-only child `chore(version): bump to <version>
            #     [auto-version]` on top of the commit that passed CI, and
            #     pushes that child and `refs/tags/v<version>` to dev in one
            #     `git push --atomic`. It then calls release.yml itself
            #     (release_ready=true, channel=dev), so a missing Release
            #     really is a broken pipeline: THIS is the orphan we file.
            #   main promotion — it tags main's promotion HEAD as it stands
            #     (`git tag "v${VERSION}" HEAD`, no source rewrite, no child
            #     commit), pushes the tag alone, and sets channel=stable with
            #     release_ready=false so release-automated is skipped on
            #     purpose: stable is never auto-dispatched, because a
            #     maintainer must start Release by hand and a DIFFERENT
            #     maintainer must approve the protected production
            #     environment. Such a tag legitimately has no Release until
            #     that human dispatch, which may be days later or never.
            # So: a tag whose own commit is not that `[auto-version]` child
            # for this exact version was minted on the promotion path, and
            # filing an incident for it alarms on the designed human gate.
            TAG_SUBJECT=$(git log -1 --format=%s "$TAG" 2>/dev/null || echo '')
            # An unreadable subject is not evidence of a promotion tag — it is
            # evidence that this check could not run. Say so and skip rather
            # than let a git failure silently suppress a real orphan.
            if [[ -z "$TAG_SUBJECT" ]]; then
              echo "::warning::could not read the commit subject of ${TAG}; skipping its promotion-tag check"
              continue
            fi
            if [[ "$TAG_SUBJECT" != "chore(version): bump to ${TAG#v} [auto-version]" ]]; then
              echo "::notice::skipping promotion tag ${TAG} (awaits a human stable dispatch, not an orphan)"
              continue
            fi
            ORPHANS+=("$TAG")
          done

          if [[ ${#ORPHANS[@]} -eq 0 ]]; then
            echo "no orphan tags detected"
            exit 0
          fi

          echo "::warning::detected ${#ORPHANS[@]} orphan tag(s): ${ORPHANS[*]}"

          # Open a release-incident issue for each orphan tag, unless an
          # issue with the same exact title already exists in ANY state
          # (idempotent). Closed issues count: closing an incident is an
          # operator ack that the orphan tag is understood debris
          # (versions auto-increment; pre-fanout failures are never
          # re-dispatched — issue #2674), so the alarm must not refile
          # it while the tag is still inside the 24h window. Exact-title
          # grep (not search-substring) so v5.X.1 never suppresses v5.X.12.
          for TAG in "${ORPHANS[@]}"; do
            TITLE="release-incident: ${TAG} has no Release object"
            # The lookup must fail loudly (set -e aborts on the assignment):
            # a transient API/rate-limit error killing the job is safer than
            # an empty result being read as "no issue exists" and refiling
            # an acknowledged incident. Only grep's no-match is expected.
            KNOWN_TITLES=$(gh issue list --repo "$REPO" --state all --limit 100 \
              --search "\"$TITLE\" in:title" --json title --jq '.[].title')
            # Fail closed on the match too: only status 1 means "not found";
            # anything else (grep error) must abort, never file a duplicate.
            MATCH_STATUS=0
            grep -Fxq "$TITLE" <<<"$KNOWN_TITLES" || MATCH_STATUS=$?
            if [[ "$MATCH_STATUS" -eq 0 ]]; then
              echo "issue already filed for ${TAG} (open or acked-closed); skipping"
              continue
            elif [[ "$MATCH_STATUS" -ne 1 ]]; then
              echo "::error::issue-title match for ${TAG} failed with status ${MATCH_STATUS}"
              exit "$MATCH_STATUS"
            fi
            gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --label release-incident \
              --body "Tag \`${TAG}\` is older than 30 minutes and has no GitHub Release object. The release.yml orchestrator (wish: release-pipeline-collapse) either never fired or failed mid-chain. Runbook: \`docs/_internal/runbooks/release-pipeline.md\` (Symptoms → Diagnosis → Recovery)."
          done
