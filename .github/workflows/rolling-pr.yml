name: Rolling PR Maintenance

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: rolling-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  maintain:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Guard — RELEASE_PLEASE_TOKEN must be valid
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN missing or invalid (HTTP 401) — mint a PAT with contents:read + pull-requests:write and add it to repo secrets"
            exit 1
          fi
          # Cheap read-only probe. Keep only status and quota headers; discard
          # the response body and gh diagnostics so neither can reach the log.
          IFS='|' read -r status remaining reset retry_after < <(
            gh api --include user 2>/dev/null | awk '
              BEGIN { headers = 1; status = "unknown" }
              { sub(/\r$/, "") }
              /^$/ { headers = 0 }
              headers && /^HTTP\// && $2 ~ /^[0-9][0-9][0-9]$/ { status = $2 }
              headers {
                name = tolower($1)
                if (name == "x-ratelimit-remaining:") remaining = $2
                if (name == "x-ratelimit-reset:") reset = $2
                if (name == "retry-after:") retry_after = $2
              }
              END { printf "%s|%s|%s|%s\n", status, remaining, reset, retry_after }
            '
          )
          case "$status" in
            2??) exit 0 ;;
            401)
              echo "::error::RELEASE_PLEASE_TOKEN missing or invalid (HTTP 401) — mint a PAT with contents:read + pull-requests:write and add it to repo secrets"
              exit 1
              ;;
            403|429)
              if [ "$remaining" = 0 ] || [ -n "$retry_after" ]; then
                reset_time=''
                if [[ "$reset" =~ ^[0-9]+$ ]]; then
                  reset_time=$(date -u -d "@$reset" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || true)
                fi
                echo "::error::release-please-token.rate_limited the token is valid but its account's API quota is exhausted${reset_time:+; rerun after $reset_time}"
                exit 1
              fi
              ;;
          esac
          echo "::error::release-please-token.probe_failed HTTP $status"
          exit 1

      - name: Check for existing Rolling PR
        id: check
        env:
          # Read path is PAT-free: listing PRs needs only read access, which
          # github.token retains even under this repo's Actions policy
          # (workflow permissions read-only, "create and approve pull
          # requests" disabled).
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if open PR exists (dev -> main)
          PR=$(gh pr list --repo ${{ github.repository }} --base main --head dev --state open --json number --jq '.[0].number')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            echo "Rolling PR #$PR exists and is up to date"
          fi

      - name: Create Rolling PR
        if: steps.check.outputs.pr == ''
        env:
          # Creation is the ONLY step that needs the PAT: verified repo policy
          # is read-only workflow permissions with "create and approve pull
          # requests" disabled, so github.token cannot create PRs.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          # Create new rolling PR. dev == main (no commits to promote) is a
          # healthy state, not a failure — tolerate exactly that error.
          set +e
          OUT=$(gh pr create --repo ${{ github.repository }} \
            --base main --head dev \
            --title "chore: rolling promotion dev -> main" \
            --body "$(cat <<'BODY'
          ## Rolling Promotion PR

          Auto-maintained rolling promotion PR from `dev` to `main`.

          **Process:**
          - This PR is automatically created and kept open
          - Human reviews and merges when ready
          - Label `ready-to-merge` added when all checks pass

          > **IMPORTANT: Merge with "Create a merge commit" — NEVER squash.**
          > Squash merging breaks history sync between dev and main,
          > causing the next rolling PR to show all commits again.

          > Human approval required for merge to production.
          BODY
          )" 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if echo "$OUT" | grep -q "No commits between"; then
              echo "dev == main — nothing to promote; healthy no-op"
            else
              echo "$OUT" >&2
              exit $RC
            fi
          else
            echo "$OUT"
            echo "Created new rolling PR"
          fi
