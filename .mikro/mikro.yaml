# mikro.yaml — Config for mikro (RLM algorithm CLI)
# Docs: https://github.com/automagik-dev/mikro
#
# Prompts live in separate .md files in this directory:
#   SYSTEM.md   — system prompt (LLM behavior & REPL instructions)
#   CRITERIA.md — output criteria (appended to system prompt for FINAL answers)
#   TOOLS.md    — custom Python tools (injected into REPL namespace)

# ─── Model ────────────────────────────────────────────────
# LLM provider and model selection.
# provider: any pi/ai provider (anthropic, openai, google, etc.)
# model: model ID for the main RLM loop
# sub-call-model: model for llm_query() sub-calls (cheaper/faster)
model:
  provider: deepseek-api          # config-declared below (pi-ai's registry knows deepseek-v4-flash, not the 4.1 alias)
  model: deepseek-flash           # DeepSeek's rolling flash alias — 4.1 Flash on 2026-09-17; reasoning model
  sub-call-model: deepseek-flash

# ─── Context ──────────────────────────────────────────────
# Configure which files are loaded when --context points to a directory.
# extensions: file extensions to include (default: [.md])
# exclude: directories/patterns to skip
context:
  extensions:
    - .md
  exclude:
    - node_modules
    - .git
    - dist

# ─── Budget ───────────────────────────────────────────────
# Cost and resource limits. null = unlimited.
# max-cost: maximum USD spend per run
# max-tokens: maximum total tokens (input + output) per run
# max-depth: maximum recursive rlm_query depth
budget:
  max-cost: 0.50            # every ambient run, including the generic mikro_query tool over MCP
  max-tokens: 400000
  max-depth: 1

# ─── Tools Level ──────────────────────────────────────────
# Controls which built-in functions are available in the REPL.
# core     — 6 paper functions only (default, paper-faithful)
# standard — core + batteries.py convenience functions + gemini batteries (if google)
# full     — standard + auto-detected package info in system prompt
tools-level: core

# ─── Storage ─────────────────────────────────────────────
# pgserve-backed large context handling.
# enabled: auto (activate when context exceeds model limit) | always | never
# mode: persistent (disk) | memory (in-memory only)
# data-dir: where pgserve stores data
# port: 0 = auto-assign
# chunk-size: null = auto-calculate from model context window
# chunk-utilization: fraction of context window to use per chunk (0-1)
# chars-per-token: character-to-token ratio for estimation
storage:
  enabled: auto
  mode: persistent
  data-dir: ~/.mikro/data
  port: 0
  chunk-size: null
  chunk-utilization: 0.6
  chars-per-token: 4

# ─── Cache (CAG Mode) ───────────────────────────────────
# Enable cache-augmented generation. Full context is baked into the
# system prompt and cached at the provider for subsequent queries.
# cache:
#   enabled: false             # true to enable CAG mode (or use --cache flag)
#   retention: long            # short|long — maps to pi/ai cacheRetention
#   ttl: 3600                  # seconds — provider-specific TTL
#   expire-time: ""            # ISO 8601 — for Google explicit caching
#   session-prefix: ""         # prepended to content hash for sessionId

# ─── Gemini 3 Native ────────────────────────────────────
# Gemini-specific features. Silently ignored for non-Google providers.
# All features are opt-in and additive — no breaking changes.
gemini:
  thinking-level: low            # not Google-only despite the key: pi-ai maps it per provider; unset = reasoning OFF
#   thinking-level: null         # minimal|low|medium|high — controls thinking depth
#   google-search: false         # Enable Google Search grounding (web_search() battery)
#   url-context: false           # Enable URL Context (fetch_url() battery)
#   code-execution: false        # Enable server-side Python execution
#   media-resolution:            # Control media token costs per type
#     images: auto               # low|medium|high|auto
#     pdfs: auto                 # low|medium|high|auto
#     video: auto                # low|medium|high|auto
#   computer-use: false          # Planned for v0.5
#   maps-grounding: false        # Planned for v0.5
#   file-search: false           # Planned for v0.5

# ─── Output ─────────────────────────────────────────────
# Structured output configuration.
# output:
#   schema:                      # JSON Schema for structured output (Gemini only)
#     type: object               # When set, model output is guaranteed to match schema
#     properties:                # Falls back to FINAL() text parsing on non-Google
#       answer:
#         type: string

# Custom providers — any OpenAI/Anthropic-compatible endpoint, then use it as
# `<id>/<model>` (here: `model: { provider: wafer, model: GLM-5.3-Flash }`).
# providers:
#   wafer:
#     base-url: https://pass.wafer.ai/v1
#     api-key-env: WAFER_API_KEY
#     headers: { Wafer-ZDR: required }
#     models:
#       GLM-5.3-Flash: { context-window: 128000, max-tokens: 16000, reasoning: true }

# ─── DeepSeek first-party endpoint (custom-typed) ──────────
# DeepSeek 4.1 Flash is served as the rolling id `deepseek-flash`; the pi-ai
# registry only knows `deepseek-v4-flash`, so it is declared here. Verified
# 2026-09-17: GET /models lists deepseek-flash and deepseek-v4-pro; a probe
# completion returned reasoning_content.
#
# cost — DeepSeek's published list prices, USD per million tokens, read from
# https://api-docs.deepseek.com/quick_start/pricing on 2026-09-18:
#
#   model            input (cache miss)   input (cache hit)   output
#   deepseek-flash   0.30 peak / 0.15     0.006 / 0.003       1.20 / 0.60
#   deepseek-v4-pro  1.32 peak / 0.66     0.044 / 0.022       3.96 / 1.98
#
# The PEAK cache-miss price is declared, deliberately, as a conservative upper
# bound: off-peak is exactly half, so a run billed off-peak costs half what the
# footer reports, never more. Cache hits are NOT modelled — mikro's cost footer
# reports one input figure and does not separate cached from uncached prompt
# tokens, so a cache-heavy run is over-reported too. `price_basis` on every
# ledger row and Phoenix span names this basis
# (`deepseek-list-2026-09-18-peak`) so a later reprice stays mechanical.
#
# context-window stays 128000 although DeepSeek documents 1M for both models:
# nothing in scripts/mikro/ reads it, mikro uses it only to bound a prompt, and
# a low cap can only refuse a run — never overrun one. max-tokens is the same
# kind of conservative cap.
#
# The key comes from Bitwarden Secrets Manager via ~/.mikro/gate-env.sh
# (`source` it before a run); mikro reads it from the env var only.
# ~/.mikro/settings.json is per-machine and mirrors this block by hand — it is
# not in the repo, so reprice it there too (see scripts/mikro/README.md).
providers:
  deepseek-api:
    api: openai-completions
    base-url: https://api.deepseek.com/v1
    api-key-env: DEEPSEEK_API_KEY
    models:
      deepseek-flash:
        context-window: 128000
        max-tokens: 16000
        reasoning: true
        input: [text]
        cost: { input: 0.30, output: 1.20 }
      deepseek-v4-pro:
        context-window: 128000
        max-tokens: 16000
        reasoning: true
        input: [text]
        cost: { input: 1.32, output: 3.96 }
