name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm run deps:ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Install/update contract smoke
        run: bash scripts/smoke-install-update.sh
