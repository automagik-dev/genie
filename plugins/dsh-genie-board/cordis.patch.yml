# The Genie suite: one manager row plus two sub-rows.
#
# The manager owns the resolved Genie executable, the trust fence and
# /api/genie-board/health; each sub-row registers only its own routes through
# the manager's `genieRuntime` service. Any row can be turned off from a profile
# patch by its id — `- id: genie-dsh-board-workflows` / `disabled: true` — and
# the browser drops that panel because health stops reporting it as mounted.
#
# The suite used to carry a third sub-row, `genie-dsh-board-skills`. It is
# retired, not disabled: `@namastexlabs/dsh-skills` owns every skills surface
# now, including the workspace-scoped read this row used to serve, so the row,
# its routes and its panel no longer exist here.
- insert:
    - id: genie-dsh-board
      name: '@automagik/genie-dsh-board'
      config:
        deadlineMs: 10000
        outputBudgetBytes: 4194304
    - id: genie-dsh-board-board
      name: '@automagik/genie-dsh-board/board'
      config:
        order: 10
    - id: genie-dsh-board-workflows
      name: '@automagik/genie-dsh-board/workflows'
      config:
        order: 12
