name: genie
version: 5.260831.7
description: "Native Hermes surface for Genie orchestration: read-only status, work-plan and review-plan tools, hooks, commands, and a thin cockpit skill."
provides_tools:
  # Exactly three native read-only planning/status tools.
  - genie_status
  - genie_work_plan
  - genie_review_plan
provides_hooks:
  - on_session_start
  - pre_tool_call
  - pre_llm_call
provides_commands:
  - genie
  - genie-board
  - genie-wish
  - genie-work-plan
  - genie-review-plan
provides_cli_commands:
  - genie
provides_skills:
  - genie
